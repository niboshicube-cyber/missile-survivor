
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MISSILE SURVIVOR</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  color-scheme: dark;
  --background: #101522;
  --grid-line: #aebbd0;
  --grid-background: #385d96;
  --missile-color: #ed1472;
}

html {
  width: 100%;
  min-height: 100%;
  margin: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: auto;
  touch-action: pan-y;
}

body {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: 14px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: visible;
  touch-action: pan-y;
  background: var(--background);
  color: #f4f7ff;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}
  
.game {
  width: 100%;
  max-width: 430px;
  max-height: none;
  overflow: visible;
  text-align: center;
  touch-action: pan-y;
  overscroll-behavior: auto;
  margin: auto;
}

h1 {
  font-size: 27px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #95a7c4;
  margin-bottom: 15px;
}

.stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 3px 12px;
}

.stat {
  min-width: 65px;
}

.stat-label {
  color: #95a7c4;
  font-size: 10px;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#starfield {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

html.game-running #stage {
  touch-action: none;
  overscroll-behavior: none;
}

#grid {
  position: absolute;
  left: 12.5%;
  top: 12.5%;
  width: 75%;
  height: 75%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  background: var(--grid-background);
  border: 2px solid var(--grid-line);
  z-index: 1;
  pointer-events: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-right: 2px solid var(--grid-line);
  border-bottom: 2px solid var(--grid-line);
}

.cell:nth-child(6n) {
  border-right: 0;
}

.cell:nth-last-child(-n + 6) {
  border-bottom: 0;
}

#player {
  position: absolute;
  background: #05080e;
  border: 2px solid #101522;
  border-radius: 5px;
  z-index: 4;
  pointer-events: none;
  transition: left 45ms linear, top 45ms linear;
}

#player::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  border: 2px solid #d7e8ff;
}

.missile {
  position: absolute;
  width: 30px;
  height: 18px;
  background: var(--missile-color);
  border-radius: 0 50% 50% 0;
  z-index: 5;
  pointer-events: none;
  will-change: left, top;
}

.special-square {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #ffd928;
  border: 1px solid #fff19a;
  z-index: 6;
  pointer-events: none;
  box-shadow: 0 0 7px rgba(255, 217, 40, 0.7);
}

.special-square.flash-white {
  background: #ffffff;
  border-color: #ffffff;
  box-shadow: 0 0 12px #ffffff;
}

.special-beam {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  background: #fff36a;
  box-shadow:
    0 0 5px #fff36a,
    0 0 12px #ffcf33;
}

.electromagnetic-ring {
  position: absolute;
  z-index: 10;
  pointer-events: none;
  border: 4px solid #42ff8b;
  border-radius: 50%;
  box-shadow:
    0 0 10px #42ff8b,
    inset 0 0 10px #42ff8b;
  transform: translate(-50%, -50%);
  opacity: 0.9;
  animation: electromagnetic-pulse 500ms ease-out forwards;
}

.electromagnetic-ring.white {
  border-color: #ffffff;
  box-shadow:
    0 0 14px #ffffff,
    0 0 28px #42ff8b,
    inset 0 0 12px #ffffff;
}

@keyframes electromagnetic-pulse {
  0% {
    transform: translate(-50%, -50%) scale(0.05);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
  }
}

.flame-trail {
  position: absolute;
  height: 9px;
  border-radius: 50%;
  background: linear-gradient(
    to right,
    #ff2600 0%,
    #ff6500 25%,
    #ffcf22 55%,
    #fff5a0 75%,
    #ff6500 100%
  );
  box-shadow:
    0 0 4px #ff2600,
    0 0 8px #ff6500,
    0 0 13px rgba(255, 100, 0, 0.8);
  transform: translate(-50%, -50%);
  z-index: 2;
  pointer-events: none;
  animation: flame-flicker 120ms infinite alternate;
}

body.slow-motion .flame-trail {
  animation-duration: 1200ms;
}

@keyframes flame-flicker {
  from {
    opacity: 0.75;
    height: 7px;
    filter: brightness(0.9);
  }
  to {
    opacity: 1;
    height: 11px;
    filter: brightness(1.4);
  }
}

.action-panel {
  width: min(100%, 360px);
  margin: 0 auto;
  padding: 9px 10px 10px;
  background: #26364f;
  border: 1px solid #354968;
  border-top: 0;
  border-radius: 0 0 8px 8px;
}

#electromagneticGauge {
  display: none;
}

.gauge-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  color: #b8c8df;
  font-size: 10px;
  letter-spacing: 1px;
}

.gauge-track {
  width: 100%;
  height: 9px;
  overflow: hidden;
  border: 1px solid #72859f;
  border-radius: 8px;
  background: #182235;
}

#gaugeFill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #168b48, #42ff8b);
  transition: width 80ms linear;
}

.action-buttons {
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 4px 0;
}

#attackButton,
#startButton {
  position: relative;
  display: flex;
  flex: 0 0 82px;
  width: 82px;
  height: 82px;
  padding: 0;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

#attackButton svg,
#startButton svg {
  display: block;
  width: 100%;
  height: 100%;
}

#attackButton:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

#attackButton:not(:disabled) {
  opacity: 1;
  filter: drop-shadow(0 0 7px rgba(32, 189, 104, 0.45));
}

#startButton {
  filter: drop-shadow(0 0 6px rgba(81, 201, 245, 0.25));
}

#startButton:active,
#attackButton:not(:disabled):active {
  transform: scale(0.94);
}

#message {
  min-height: 30px;
  padding: 7px 0 4px;
  font-size: 13px;
  color: #bdcbe0;
}

.controls {
  display: none !important;
}

.controls button {
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: #29364b;
  color: white;
  font-size: 20px;
  touch-action: none;
}

.controls .empty {
  visibility: hidden;
}

@media (min-width: 600px) {
  .controls {
    display: none;
  }
}

@media (max-height: 650px) {
  body {
    padding: 6px;
  }

  h1 {
    font-size: 21px;
  }

  .subtitle {
    margin-bottom: 7px;
  }

  .stats {
    margin-bottom: 6px;
  }

  #stage {
    width: min(76vw, 360px, 43dvh);
  }

  #message {
    min-height: 28px;
    padding: 5px 0;
  }

  #startButton {
    padding: 9px;
  }

  .controls {
    margin-top: 5px;
  }
}

.explosion-burst {
  position: absolute;
  width: 1px;
  height: 1px;
  z-index: 20;
  pointer-events: none;
}

.explosion-burst {
  position: absolute;
  width: 1px;
  height: 1px;
  z-index: 20;
  pointer-events: none;
}

.explosion-flash {
  position: absolute;
  left: -90px;
  top: -90px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 1) 0%,
    rgba(255, 245, 170, 0.95) 12%,
    rgba(255, 145, 35, 0.75) 32%,
    rgba(255, 50, 20, 0.35) 52%,
    transparent 72%
  );
  animation: explosion-flash 300ms ease-out forwards;
}

.explosion-ring {
  position: absolute;
  left: -12px;
  top: -12px;
  width: 24px;
  height: 24px;
  border: 5px solid #fff4ae;
  border-radius: 50%;
  box-shadow:
    0 0 12px #fff,
    0 0 28px #ffb52e;
  animation: explosion-ring 500ms cubic-bezier(.1,.7,.3,1) forwards;
}

.explosion-ring.second {
  border-color: #ff6533;
  animation-delay: 60ms;
}

.explosion-particle {
  position: absolute;
  left: -4px;
  top: -4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff8c7;
  box-shadow:
    0 0 6px #fff,
    0 0 14px #ff9b22;
  animation: explosion-particle 650ms cubic-bezier(.1,.7,.3,1) forwards;
}

.explosion-particle.hot {
  width: 12px;
  height: 12px;
  left: -6px;
  top: -6px;
  background: #ff542b;
  box-shadow: 0 0 14px #ff3b16;
}

.explosion-smoke {
  position: absolute;
  left: -10px;
  top: -10px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(120, 135, 155, 0.75);
  filter: blur(3px);
  animation: explosion-smoke 800ms ease-out forwards;
}

@keyframes explosion-flash {
  0% {
    transform: scale(0.1);
    opacity: 1;
  }
  25% {
    transform: scale(1.5);
    opacity: 1;
  }
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}

@keyframes explosion-ring {
  0% {
    transform: scale(0.2);
    opacity: 1;
    border-width: 5px;
  }
  100% {
    transform: scale(7);
    opacity: 0;
    border-width: 1px;
  }
}

@keyframes explosion-particle {
  0% {
    transform: translate(0, 0) scale(1.5);
    opacity: 1;
  }
  70% {
    opacity: 0.9;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) scale(0.1);
    opacity: 0;
  }
}

@keyframes explosion-smoke {
  0% {
    transform: translate(0, 0) scale(0.5);
    opacity: 0.7;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) scale(3.5);
    opacity: 0;
  }
}

body.slow-motion {
  background: #292c35;
}

body.slow-motion #stage {
  background: #343b49;
  border-color: #596273;
}

body.slow-motion #grid {
  background: #536174;
  border-color: #a1a8b5;
}

body.slow-motion .cell {
  border-color: #a1a8b5;
}

.mode-menu {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin: 0 0 12px;
}

.mode-button {
  padding: 10px 5px;
  border: 1px solid #536781;
  border-radius: 8px;
  background: #202b3d;
  color: #e4edfa;
  font-size: 12px;
  font-weight: 800;
  touch-action: manipulation;
}

.mode-button.selected {
  border-color: #42ff8b;
  background: #164b32;
  color: #d9ffe6;
}

.mode-menu.disabled {
  opacity: 0.55;
  pointer-events: none;
}

html.game-running,
html.game-running body {
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

html.game-running body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  min-height: 0;
}

html.game-running .game {
  max-height: 100%;
  overflow: hidden;
  touch-action: none;
}

#onlineRanking {
  margin: 18px 0 30px;
  padding: 14px;
  border: 1px solid #354968;
  border-radius: 10px;
  background: #182235;
  text-align: left;
}

#onlineRanking h2 {
  margin: 0 0 12px;
  font-size: 17px;
  text-align: center;
}

#playerNameArea {
  display: flex;
  gap: 7px;
  margin-bottom: 12px;
}

#playerName {
  min-width: 0;
  flex: 1;
  padding: 10px;
  border: 1px solid #536781;
  border-radius: 7px;
  background: #101522;
  color: #fff;
  font-size: 14px;
}

#savePlayerName,
#refreshRanking {
  padding: 9px 11px;
  border: 1px solid #536781;
  border-radius: 7px;
  background: #29364b;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}

#rankingStatus {
  min-height: 18px;
  margin-bottom: 8px;
  color: #95a7c4;
  font-size: 11px;
  text-align: center;
  overflow-wrap: anywhere;
}

#rankingList {
  margin: 0;
  padding: 0;
  list-style: none;
}

#rankingList li {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 9px 3px;
  border-bottom: 1px solid #354968;
  font-size: 13px;
}

#rankingList li:last-child {
  border-bottom: 0;
}

.ranking-rank {
  color: #ffd928;
  font-weight: 800;
}

.ranking-name {
  overflow-wrap: anywhere;
}

.ranking-score {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#starfield {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}
</style>
</head>

<body>
<main class="game">
  <h1>MISSILE SURVIVOR</h1>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">0.0</div>
    </div>
    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div id="grid"></div>
    <div id="player"></div>
  </div>

    <div class="action-panel">
    <div id="electromagneticGauge">
      <div class="gauge-label">
        <span>ELECTROMAGNETIC WAVE</span>
        <span id="gaugePercent">0%</span>
      </div>
      <div class="gauge-track">
        <div id="gaugeFill"></div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="attackButton" disabled aria-label="電磁波攻撃">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46"
            fill="none" stroke="#536781" stroke-width="5"/>
          <circle id="gaugeCircle" cx="50" cy="50" r="46"
            fill="none" stroke="#ffe45c" stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="289.03"
            stroke-dashoffset="289.03"
            transform="rotate(-90 50 50)"/>
          <circle cx="50" cy="50" r="37" fill="#20bd68"/>
          <path d="M55 25 L36 54 L49 54 L44 76 L66 44 L53 44 Z"
            fill="#ffffff"/>
        </svg>
      </button>

      <button id="startButton" aria-label="ゲーム開始">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="#51c9f5"/>
          <path d="M42 29 L42 71 L73 50 Z" fill="#ffffff"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="message">スタートしてミサイルを避けよう！</div>
  <div class="controls">
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="up">↑</button>
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="left">←</button>
    <button data-dir="down">↓</button>
    <button data-dir="right">→</button>
  </div>

  <div class="mode-menu" id="modeMenu">
    <button class="mode-button selected" data-mode="all">ALL：全種類</button>
    <button class="mode-button" data-mode="normal">NORMAL：通常</button>
    <button class="mode-button" data-mode="fast">FAST：高速</button>
    <button class="mode-button" data-mode="big">BIG：大型</button>
    <button class="mode-button" data-mode="special">BEAM：特殊</button>
  </div>
    <section id="onlineRanking">
    <h2>ONLINE RANKING</h2>

    <div id="playerNameArea">
      <input
        id="playerName"
        type="text"
        maxlength="16"
        placeholder="プレイヤー名（1〜16文字）"
        autocomplete="nickname"
      >
      <button id="savePlayerName" type="button">登録</button>
    </div>

    <div id="rankingStatus">ランキングを読み込み中...</div>

    <ol id="rankingList"></ol>

    <button id="refreshRanking" type="button" style="width:100%">
      ランキング更新
    </button>
  </section>
</main>
  
<script>
"use strict";

const SIZE = 6;
const SUPABASE_URL = "https://miqwgpvfbntmvrgnpqqt.supabase.co";
const SUPABASE_KEY = "sb_publishable_pf5RTfpcQzKxlsJTNtnXnQ_-ItCh5GM";

const playerNameInput = document.getElementById("playerName");
const savePlayerNameButton = document.getElementById("savePlayerName");
const rankingStatus = document.getElementById("rankingStatus");
const rankingList = document.getElementById("rankingList");
const refreshRankingButton = document.getElementById("refreshRanking");

const PLAYER_NAME_KEY = "missileSurvivorPlayerName";

function getPlayerName() {
  try {
    return localStorage.getItem(PLAYER_NAME_KEY) || "";
  } catch {
    return "";
  }
}

function savePlayerName() {
  const name = playerNameInput.value.trim();

  if (name.length < 1 || name.length > 16) {
    rankingStatus.textContent = "名前は1〜16文字で入力してください。";
    return;
  }

  try {
    localStorage.setItem(PLAYER_NAME_KEY, name);
  } catch {
    rankingStatus.textContent = "名前を保存できませんでした。";
    return;
  }

  playerNameInput.value = name;
  rankingStatus.textContent = "プレイヤー名を登録しました。";
}

playerNameInput.value = getPlayerName();

savePlayerNameButton.addEventListener("click", savePlayerName);

playerNameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    savePlayerName();
  }
});

async function submitOnlineScore() {
  const playerName = getPlayerName().trim();

  if (playerName.length < 1 || playerName.length > 16) {
    rankingStatus.textContent =
      "スコア送信には、先にプレイヤー名を登録してください。";
    return;
  }

  rankingStatus.textContent = "スコアを送信中...";

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/submit_missile_survivor_score",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_player_name: playerName,
          p_mode: selectedMode,
          p_score: score
        })
      }
    );

    if (!response.ok) {
      throw new Error("Score submission failed: " + response.status);
    }

    rankingStatus.textContent = "スコアを送信しました！";
    await loadOnlineRanking();
  } catch (error) {
    rankingStatus.textContent =
      "送信に失敗しました。通信設定を確認して再試行してください。";
  }
}

async function loadOnlineRanking() {
  rankingStatus.textContent = "ランキングを読み込み中...";
  rankingList.replaceChildren();

  try {
    const url = new URL(
      SUPABASE_URL + "/rest/v1/missile_survivor_scores"
    );

    url.searchParams.set("select", "player_name,score");
    url.searchParams.set("mode", "eq." + selectedMode);
    url.searchParams.set("order", "score.desc,created_at.asc");
    url.searchParams.set("limit", "10");

    const response = await fetch(url.toString(), {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if (!response.ok) {
      throw new Error("Ranking request failed: " + response.status);
    }

    const results = await response.json();

    if (results.length === 0) {
      rankingStatus.textContent = "まだランキングの記録がありません。";
      return;
    }

    const fragment = document.createDocumentFragment();

    results.forEach((entry, index) => {
      const item = document.createElement("li");

      const rank = document.createElement("span");
      rank.className = "ranking-rank";
      rank.textContent = (index + 1) + ".";

      const name = document.createElement("span");
      name.className = "ranking-name";
      name.textContent = entry.player_name;

      const points = document.createElement("span");
      points.className = "ranking-score";
      points.textContent = Number(entry.score).toLocaleString();

      item.append(rank, name, points);
      fragment.appendChild(item);
    });

    rankingList.appendChild(fragment);
    rankingStatus.textContent =
      selectedMode.toUpperCase() + " モード TOP 10";
  } catch (error) {
    rankingStatus.textContent =

        "big"
      )

  const m = {
    type,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: 0,

    h: 18,

  };

      : g.gridTop + (lane + 0.5) * g.cellHeight;

function playSpecialSound(frequency, duration, volume = 0.07) {
  try {
    if (!audioContext) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(frequency, now);

    gain.gain.setValueAtTime(volume, now);
    gain.gain.setValueAtTime(volume, now + duration * 0.75);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + duration);
  } catch {}
}

let slowMotionOscillator = null;
let slowMotionGain = null;

function startSlowMotionSound() {
  if (slowMotionOscillator || !running) return;

  try {
    if (!audioContext) {
      audioContext = new (
        window.AudioContext || window.webkitAudioContext
      )();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const now = audioContext.currentTime;
    slowMotionOscillator = audioContext.createOscillator();
    slowMotionGain = audioContext.createGain();

    slowMotionOscillator.type = "sawtooth";
    slowMotionOscillator.frequency.setValueAtTime(65, now);
    slowMotionGain.gain.setValueAtTime(0.0001, now);
    slowMotionGain.gain.linearRampToValueAtTime(0.055, now + 0.15);

    slowMotionOscillator.connect(slowMotionGain);
    slowMotionGain.connect(audioContext.destination);
    slowMotionOscillator.start();
  } catch (error) {
    slowMotionOscillator = null;
    slowMotionGain = null;
  }
}

function stopSlowMotionSound() {
  if (!slowMotionOscillator) return;

  try {
    const oscillator = slowMotionOscillator;
    const gain = slowMotionGain;
    const now = audioContext.currentTime;

    gain.gain.cancelScheduledValues(now);
    gain.gain.setTargetAtTime(0.0001, now, 0.035);
    oscillator.stop(now + 0.15);

    slowMotionOscillator = null;
    slowMotionGain = null;
  } catch (error) {
    slowMotionOscillator = null;
    slowMotionGain = null;
  }
}

function detectPlayer(special) {
  const g = getLayout();

  if (special.axis === "horizontal") {
    const targetX =
      g.gridLeft + (player.x + 0.5) * g.cellWidth;

    const distance = targetX - special.x;

    if (
      (special.direction === 1 && distance >= 0 &&
        distance <= special.speed * 0.05 + 1) ||
      (special.direction === -1 && distance <= 0 &&
        distance >= -(special.speed * 0.05 + 1))
    ) {
      special.x = targetX;
      special.targetLane = player.x;
      beginSpecialFlash(special);
    }
  } else {
    const targetY =
      g.gridTop + (player.y + 0.5) * g.cellHeight;

    const distance = targetY - special.y;

    if (
      (special.direction === 1 && distance >= 0 &&
        distance <= special.speed * 0.05 + 1) ||
      (special.direction === -1 && distance <= 0 &&
        distance >= -(special.speed * 0.05 + 1))
    ) {
      special.y = targetY;
      special.targetLane = player.y;
      beginSpecialFlash(special);
    }
  }
}

function beginSpecialFlash(special) {
  special.phase = "flash";
  special.phaseStart = performance.now();
  special.phaseElapsed = 0;
  special.flashStep = 0;

  playSpecialSound(900, 0.09);
}

function updateSpecialMissiles(now, dt, timeScale) {
  const g = getLayout();
  const remaining = [];

  for (const special of specialMissiles) {
    if (special.phase === "moving") {
      if (special.axis === "horizontal") {
        special.x += special.direction * special.speed * dt * timeScale;
      } else {
        special.y += special.direction * special.speed * dt * timeScale;
      }

      detectPlayer(special);

      if (special.phase === "moving") {
        const outside = special.axis === "horizontal"
          ? (special.x < -30 || special.x > g.width + 30)
          : (special.y < -30 || special.y > g.height + 30);

        if (outside) {
          removeSpecialMissile(special);
          continue;
        }
      }
    }

    if (special.phase === "flash") {
      special.phaseElapsed += dt * 1000 * timeScale;
      const elapsed = special.phaseElapsed;
      const step = Math.floor(elapsed / 150);

      if (step !== special.flashStep && step < 4) {
        special.flashStep = step;

        if (step === 0 || step === 2) {
          playSpecialSound(900, 0.08);
        }
      }

      if (elapsed >= 600) {
        special.phase = "beam";
        special.phaseElapsed = 0;
        special.phaseStart = now;
        special.beamOn = true;
        special.flashStep = -1;

        playSpecialSound(650, 0.12);
      }
    } else if (special.phase === "beam") {
      special.phaseElapsed += dt * 1000 * timeScale;
      const elapsed = special.phaseElapsed;

      if (elapsed < 200) {
        special.beamOn = true;
      } else {
        removeSpecialMissile(special);
        continue;
      }
    }

    drawSpecialMissile(special);
    remaining.push(special);
  }

  specialMissiles = remaining;
}

function removeSpecialMissile(special) {
  for (const square of special.squares) {
    square.remove();
  }
  special.beamElement.remove();
}

function checkSpecialCollision() {
  return specialMissiles.some(special => {
    if (special.phase !== "beam" || !special.beamOn) {
      return false;
    }

    if (special.axis === "horizontal") {
      return player.x === special.targetLane;
    }

    return player.y === special.targetLane;
  });
}

function getCollidingMissile() {
  const g = getLayout();

  const left = g.gridLeft + player.x * g.cellWidth + 5;
  const right = left + g.cellWidth - 10;
  const top = g.gridTop + player.y * g.cellHeight + 5;
  const bottom = top + g.cellHeight - 10;

  return missiles.find(m => {
    const vertical = m.angle === 90 || m.angle === -90;
    const w = vertical ? m.h : m.w;
    const h = vertical ? m.w : m.h;

    return (
      m.x + w / 2 > left &&
      m.x - w / 2 < right &&
      m.y + h / 2 > top &&
      m.y - h / 2 < bottom
    );
  }) || null;
}

function checkFlameCollisions(dt, timeScale) {
  const g = getLayout();

  flameTrails = flameTrails.filter(flame => {
    flame.age += dt * 1000 * timeScale;

    if (flame.age >= 500) {
      flame.element.remove();
      return false;
    }

    return true;
  });

  const remaining = [];

  for (const m of missiles) {
    let hitFlame = false;

    const vertical = m.angle === 90 || m.angle === -90;
    const halfW = (vertical ? m.h : m.w) / 2;
    const halfH = (vertical ? m.w : m.h) / 2;

    const missileLeft = m.x - halfW;
    const missileRight = m.x + halfW;
    const missileTop = m.y - halfH;
    const missileBottom = m.y + halfH;

    for (const flame of flameTrails) {
      const x1 =
        g.gridLeft + (flame.x1 + 0.5) * g.cellWidth;
      const y1 =
        g.gridTop + (flame.y1 + 0.5) * g.cellHeight;

      const x2 =
        g.gridLeft + (flame.x2 + 0.5) * g.cellWidth;
      const y2 =
        g.gridTop + (flame.y2 + 0.5) * g.cellHeight;

      const flameLeft = Math.min(x1, x2) - 5;
      const flameRight = Math.max(x1, x2) + 5;
      const flameTop = Math.min(y1, y2) - 5;
      const flameBottom = Math.max(y1, y2) + 5;

      if (
        missileRight > flameLeft &&
        missileLeft < flameRight &&
        missileBottom > flameTop &&
        missileTop < flameBottom
      ) {
        hitFlame = true;
        break;
      }
    }

    if (hitFlame) {
      addGauge(5);
      createExplosion(m.x, m.y);
      m.element.remove();
    } else {
      remaining.push(m);
    }
  }

  missiles = remaining;
}

function getApproachingThreat() {
  const g = getLayout();
  const px = g.gridLeft + (player.x + 0.5) * g.cellWidth;
  const py = g.gridTop + (player.y + 0.5) * g.cellHeight;
  const playerLeft = px - g.cellWidth / 2;
  const playerRight = px + g.cellWidth / 2;
  const playerTop = py - g.cellHeight / 2;
  const playerBottom = py + g.cellHeight / 2;

  const regularThreat = missiles.some(m => {
    if (m.slowMotionIgnored || (m.vx === 0 && m.vy === 0)) {
      return false;
    }

    const vertical = m.angle === 90 || m.angle === -90;
    const halfW = (vertical ? m.h : m.w) / 2;
    const halfH = (vertical ? m.w : m.h) / 2;

    const missileLeft = m.x - halfW;
    const missileRight = m.x + halfW;
    const missileTop = m.y - halfH;
    const missileBottom = m.y + halfH;

    const gapX = Math.max(
      0,
      playerLeft - missileRight,
      missileLeft - playerRight
    );
    const gapY = Math.max(
      0,
      playerTop - missileBottom,
      missileTop - playerBottom
    );

    if (gapX > g.cellWidth || gapY > g.cellHeight) {
      return false;
    }

    const targetLeft = playerLeft - halfW;
    const targetRight = playerRight + halfW;
    const targetTop = playerTop - halfH;
    const targetBottom = playerBottom + halfH;

    let entryX = -Infinity;
    let exitX = Infinity;
    let entryY = -Infinity;
    let exitY = Infinity;

    if (m.vx > 0) {
      entryX = (targetLeft - m.x) / m.vx;
      exitX = (targetRight - m.x) / m.vx;
    } else if (m.vx < 0) {
      entryX = (targetRight - m.x) / m.vx;
      exitX = (targetLeft - m.x) / m.vx;
    } else if (m.x < targetLeft || m.x > targetRight) {
      return false;
    }

    if (m.vy > 0) {
      entryY = (targetTop - m.y) / m.vy;
      exitY = (targetBottom - m.y) / m.vy;
    } else if (m.vy < 0) {
      entryY = (targetBottom - m.y) / m.vy;
      exitY = (targetTop - m.y) / m.vy;
    } else if (m.y < targetTop || m.y > targetBottom) {
      return false;
    }

    const entryTime = Math.max(entryX, entryY);
    const exitTime = Math.min(exitX, exitY);
    const threat = exitTime >= Math.max(entryTime, 0);

    if (threat) {
      m.slowMotionDetected = true;
    }

    return threat;
  });

  const beamThreat = specialMissiles.some(special => {
    if (
      special.phase !== "flash" ||
      special.slowMotionIgnored
    ) {
      return false;
    }

    special.slowMotionDetected = true;
    return true;
  });

  return regularThreat || beamThreat;
}

function activateElectromagneticWave() {
  if (!running || electromagneticGauge < 100) return;

  electromagneticGauge = 0;
  updateGaugeDisplay();

  const g = getLayout();
  const element = document.createElement("div");

  element.className = "electromagnetic-ring white";
  element.style.left =
    (g.gridLeft + (player.x + 0.5) * g.cellWidth) + "px";
  element.style.top =
    (g.gridTop + (player.y + 0.5) * g.cellHeight) + "px";
  element.style.width = "0px";
  element.style.height = "0px";

  stage.appendChild(element);

  electromagneticWaves.push({
    x: g.gridLeft + (player.x + 0.5) * g.cellWidth,
    y: g.gridTop + (player.y + 0.5) * g.cellHeight,
    start: performance.now(),
    duration: 500,
    maxRadius: Math.hypot(g.width, g.height),
    previousRadius: 0,
    hit: new Set(),
    element
  });

  playSpecialSound(650, 0.2);
}
  
function updateElectromagneticWaves(now) {
  const g = getLayout();
  const remainingWaves = [];
  const remainingMissiles = [];

  for (const wave of electromagneticWaves) {
    if (now < wave.start) {
      remainingWaves.push(wave);
      continue;
    }

    const progress = Math.min(1, (now - wave.start) / wave.duration);
    const radius = wave.maxRadius * progress;

    wave.element.style.width = radius * 2 + "px";
    wave.element.style.height = radius * 2 + "px";

    for (const m of missiles) {
      if (wave.hit.has(m)) continue;

      const vertical = m.angle === 90 || m.angle === -90;
      const halfW = (vertical ? m.h : m.w) / 2;
      const halfH = (vertical ? m.w : m.h) / 2;
      const hitRadius = Math.hypot(halfW, halfH) + 5;
      const distance = Math.hypot(m.x - wave.x, m.y - wave.y);

      if (
        distance <= radius + hitRadius &&
        distance >= wave.previousRadius - hitRadius
      ) {
        wave.hit.add(m);
        m.electromagneticHit = true;
      }
    }

    for (const special of specialMissiles) {
      if (wave.hit.has(special)) continue;

      const bodyCenters = special.axis === "horizontal"
        ? [
            { x: special.x, y: g.gridTop - 8 },
            { x: special.x, y: g.gridTop + g.gridHeight + 8 }
          ]
        : [
            { x: g.gridLeft - 8, y: special.y },
            { x: g.gridLeft + g.gridWidth + 8, y: special.y }
          ];

      const hit = bodyCenters.some(body => {
        const distance = Math.hypot(
          body.x - wave.x,
          body.y - wave.y
        );

        return (
          distance <= radius + 12 &&
          distance >= wave.previousRadius - 12
        );
      });

      if (hit) {
        wave.hit.add(special);
        special.electromagneticHit = true;
      }
    }

    wave.previousRadius = radius;

    if (progress >= 1) {
      wave.element.remove();
    } else {
      remainingWaves.push(wave);
    }
  }

  electromagneticWaves = remainingWaves;

  for (const m of missiles) {
    if (m.electromagneticHit) {
      createExplosion(m.x, m.y);
      m.element.remove();
    } else {
      remainingMissiles.push(m);
    }
  }

  missiles = remainingMissiles;

  const remainingSpecialMissiles = [];

  for (const special of specialMissiles) {
    if (special.electromagneticHit) {
      const g = getLayout();

      const x = special.x;
      const y = special.axis === "horizontal"
        ? (
            special.direction === 1
              ? g.gridTop
              : g.gridTop + g.gridHeight
          )
        : (
            special.direction === 1
              ? g.gridLeft
              : g.gridLeft + g.gridWidth
          );

      createExplosion(x, y);
      removeSpecialMissile(special);
    } else {
      remainingSpecialMissiles.push(special);
    }
  }

  specialMissiles = remainingSpecialMissiles;
}

function movePlayer(dx, dy) {
  if (!running) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) return;

  player.x = nx;
  player.y = ny;

  addFlameTrail(nx, ny);
  drawPlayer();

  const hitMissile = getCollidingMissile();

  if (hitMissile || checkSpecialCollision()) {
    handlePlayerHit(hitMissile);
  }
}

function gameLoop(now) {
  if (!running) return;

  const dt = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;

  const realElapsed = (now - startTime) / 1000;
  const elapsed = gameElapsed;

  score = Math.floor(elapsed * 10);
  scoreElement.textContent = score;
  timeElement.textContent = elapsed.toFixed(1);

  const spawnInterval = Math.max(180, 600 - elapsed * 7);
  let speedFactor = Math.min(2.2, 1 + elapsed * 0.012);

  if (isOuterLayer()) {
    addGauge(10 * dt);
  } else if (isSecondOuterLayer()) {
    addGauge(5 * dt);
  }

  
  const approachingThreat =
    electromagneticGauge >= 100 && getApproachingThreat();

  if (!approachingThreat) {
    slowMotionBlocked = false;
    slowMotionActive = false;
  } else if (!slowMotionBlocked) {
    slowMotionActive = true;
  }

  if (slowMotionActive && approachingThreat) {
    speedFactor *= 0.1;
    document.body.classList.add("slow-motion");
    startSlowMotionSound();
  } else {
    slowMotionActive = false;
    document.body.classList.remove("slow-motion");
    stopSlowMotionSound();
  }

  if (
    selectedMode === "all" &&
    now - lastSpecialSpawnTime >= 5000
  ) {
    spawnSpecialMissile();
    lastSpecialSpawnTime = now;
  }

  if (
    selectedMode === "special" &&
    now - lastSpecialSpawnTime >= spawnInterval
  ) {
    spawnSpecialMissile();
    lastSpecialSpawnTime = now;
  }

  if (
    selectedMode !== "special" &&
    now - lastSpawnTime >= spawnInterval
  ) {
    spawnMissile();

    if (
      selectedMode === "all" &&
      Math.random() < 1 / 30
    ) {
      spawnSpecialMissile();
    }

    lastSpawnTime = now;
  }
  const g = getLayout();
  const remaining = [];

  for (const m of missiles) {
    const g = getLayout();

    const insideGrid =
      m.x >= g.gridLeft &&
      m.x <= g.gridLeft + g.gridWidth &&
      m.y >= g.gridTop &&
      m.y <= g.gridTop + g.gridHeight;

    if (!m.insideGrid && insideGrid) {
      m.insideGrid = true;

      const directionX = Math.sign(m.vx);
      const directionY = Math.sign(m.vy);

      m.vx = directionX * m.baseSpeed;
      m.vy = directionY * m.baseSpeed;
    }

    m.x += m.vx * speedFactor * dt;
    m.y += m.vy * speedFactor * dt;

    const vertical = m.angle === 90 || m.angle === -90;
    const halfW = (vertical ? m.h : m.w) / 2;
    const halfH = (vertical ? m.w : m.h) / 2;
    const outside =
      m.x + halfW < 0 ||
      m.x - halfW > g.width ||
      m.y + halfH < 0 ||
      m.y - halfH > g.height;

    if (outside) {
      m.element.remove();
    } else {
      remaining.push(m);
    }
  }

  missiles = remaining;

  gameElapsed += dt * (slowMotionActive ? 0.1 : 1);
  const timeScale = slowMotionActive ? 0.1 : 1;

  checkFlameCollisions(dt, timeScale);

  updateSpecialMissiles(now, dt, timeScale);
  updateElectromagneticWaves(now);
  
  const hitMissile = getCollidingMissile();

  if (hitMissile) {
    handlePlayerHit(hitMissile);
    return;
  }

  if (checkSpecialCollision()) {
    handlePlayerHit();
    return;
  }

  render();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  for (const m of missiles) m.element.remove();
  for (const special of specialMissiles) {
    removeSpecialMissile(special);
  }

  missiles = [];
  specialMissiles = [];

  for (const wave of electromagneticWaves) {
    wave.element.remove();
  }
  electromagneticWaves = [];
  electromagneticGauge = 0;
  updateGaugeDisplay();

for (const flame of flameTrails) {
  flame.element.remove();
}
flameTrails.forEach(flame => flame.element.remove());
flameTrails = [];
lastFlamePoint = { x: player.x, y: player.y };
  
player = { x: 2, y: 2 };
lastFlamePoint = { x: player.x, y: player.y };
  playerElement.style.visibility = "visible";
  score = 0;
  best = readBest();
  bestElement.textContent = best;
  running = true;
  document.documentElement.classList.add("game-running");
  modeMenu.classList.add("disabled");

  startTime = performance.now();
  previousTime = startTime;
  gameElapsed = 0;
  lastSpawnTime = startTime;
  lastSpecialSpawnTime = startTime;

  scoreElement.textContent = "0";
  timeElement.textContent = "0.0";
  messageElement.textContent = "四方からのミサイルを避けろ！";
  startButton.style.display = "none";
  updateGaugeDisplay();

  render();
  animationId = requestAnimationFrame(gameLoop);
}

function endGame() {
  if (!running) return;

  running = false;
  document.documentElement.classList.remove("game-running");
  modeMenu.classList.remove("disabled");
  document.body.classList.remove("slow-motion");
　stopSlowMotionSound();
  
  for (const flame of flameTrails) {
  　flame.element.remove();
　}
　flameTrails = [];
　lastFlamePoint = null;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (score > best) {
    best = score;
    saveBest(best);
    bestElement.textContent = best;
    messageElement.textContent = "NEW BEST! スコア：" + score;
  } else {
    messageElement.textContent = "GAME OVER！ スコア：" + score;
  }

  startButton.style.display = "block";
  updateGaugeDisplay();
  submitOnlineScore();
}

const directions = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

function handleDirection(direction) {
  if (slowMotionActive) {
    for (const m of missiles) {
      if (m.slowMotionDetected) {
        m.slowMotionIgnored = true;
      }
    }

    for (const special of specialMissiles) {
      if (special.slowMotionDetected) {
        special.slowMotionIgnored = true;
      }
    }
  }

  slowMotionActive = false;
  slowMotionBlocked = true;

  const [dx, dy] = directions[direction];
  movePlayer(dx, dy);
}
document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    handleDirection(button.dataset.dir);
  });
});

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const keyMap = {
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right"
  };

  const direction = keyMap[key];

  if (direction && running) {
    event.preventDefault();
    handleDirection(direction);
  }
});

let touchStartX = 0;
let touchStartY = 0;
let touchActive = false;

document.addEventListener("touchstart", event => {
  if (!running || event.changedTouches.length === 0) return;

  const touch = event.changedTouches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchActive = true;

  event.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", event => {
  if (running) {
    event.preventDefault();
  }
}, { passive: false });

document.addEventListener("touchend", event => {
  if (!running || !touchActive || event.changedTouches.length === 0) {
    touchActive = false;
    return;
  }

  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  touchActive = false;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    handleDirection(dx > 0 ? "right" : "left");
  } else {
    handleDirection(dy > 0 ? "down" : "up");
  }

  event.preventDefault();
}, { passive: false });

document.addEventListener("touchcancel", () => {
  touchActive = false;
}, { passive: false });

startButton.addEventListener("click", startGame);
attackButton.addEventListener("pointerdown", event => {
  event.preventDefault();
  activateElectromagneticWave();
});

window.addEventListener("resize", render);

updateGaugeDisplay();
render();
loadOnlineRanking();
const starfield = document.getElementById("starfield");
const starContext = starfield.getContext("2d");
const stars = [];
let starLastFrame = 0;

function resizeStarfield() {
  const rect = starfield.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  starfield.width = Math.round(rect.width * dpr);
  starfield.height = Math.round(rect.height * dpr);
  starContext.setTransform(dpr, 0, 0, dpr, 0, 0);

  stars.length = 0;

  const count = Math.floor(rect.width * rect.height / 1800);

  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * rect.width,
      y: Math.random() * rect.height,
      size: 0.4 + Math.random() * 1.5,
      speed: 15 + Math.random() * 100,
      alpha: 0.3 + Math.random() * 0.7
    });
  }
}

function animateStarfield(now) {
  const rect = starfield.getBoundingClientRect();
  const dt = starLastFrame
    ? Math.min((now - starLastFrame) / 1000, 0.05)
    : 0;

  starLastFrame = now;
  starContext.clearRect(0, 0, rect.width, rect.height);

  for (const star of stars) {
    star.x -= star.speed * dt * 0.72;
    star.y -= star.speed * dt * 0.42;

    if (star.x < -3) star.x = rect.width + 3;
    if (star.y < -3) star.y = rect.height + 3;

    starContext.fillStyle =
      `rgba(225, 239, 255, ${star.alpha})`;

    starContext.beginPath();
    starContext.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    starContext.fill();
  }

  requestAnimationFrame(animateStarfield);
}

resizeStarfield();
window.addEventListener("resize", resizeStarfield);
requestAnimationFrame(animateStarfield);
</script>
