
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MISSILE SURVIVOR</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  color-scheme: dark;
  --background: #101522;
  --grid-line: #aebbd0;
  --grid-background: #385d96;
}

html {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  background: var(--background);
  color: #f4f7ff;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

.game {
  width: 100%;
  max-width: 430px;
  max-height: 100%;
  overflow: hidden;
  text-align: center;
  touch-action: none;
  overscroll-behavior: none;
}

h1 {
  font-size: 27px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #95a7c4;
  margin-bottom: 15px;
}

.stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 3px 12px;
}

.stat {
  min-width: 65px;
}

.stat-label {
  color: #95a7c4;
  font-size: 10px;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#stage {
  position: relative;
  width: min(100%, 360px);
  aspect-ratio: 1;
  flex-shrink: 0;
  margin: 0 auto;
  overflow: hidden;
  background: #26364f;
  border: 1px solid #354968;
  border-radius: 8px;
  touch-action: none;
  overscroll-behavior: none;
}

#grid {
  position: absolute;
  left: 12.5%;
  top: 12.5%;
  width: 75%;
  height: 75%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  background: var(--grid-background);
  border: 2px solid var(--grid-line);
  z-index: 1;
  pointer-events: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-right: 2px solid var(--grid-line);
  border-bottom: 2px solid var(--grid-line);
}

.cell:nth-child(6n) {
  border-right: 0;
}

.cell:nth-last-child(-n + 6) {
  border-bottom: 0;
}

#player {
  position: absolute;
  background: #05080e;
  border: 2px solid #101522;
  border-radius: 5px;
  z-index: 4;
  pointer-events: none;
  transition: left 45ms linear, top 45ms linear;
}

#player::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  border: 2px solid #d7e8ff;
}

.missile {
  position: absolute;
  background: var(--missile-color, #ed1472);
  border-radius: 0 50% 50% 0;
  z-index: 5;
  pointer-events: none;
  will-change: left, top;
}

.missile.normal {
  width: 30px;
  height: 18px;
  --missile-color: #ed1472;
}

.missile.fast {
  width: 27px;
  height: 9px;
  --missile-color: #22d3c5;
  border-radius: 0 50% 50% 0;
}

.missile.big {
  width: 120px;
  height: 72px;
  background: #05070c;
  border: 1px solid #718096;
  border-radius: 8px;
}

.special-square {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #ffd928;
  border: 1px solid #fff19a;
  z-index: 6;
  pointer-events: none;
  box-shadow: 0 0 12px #ffd928, 0 0 24px #ffd928;
}

.special-square.flash-white {
  background: #fff;
  border-color: #fff;
  box-shadow: 0 0 18px #fff, 0 0 32px #fff;
}

.special-beam {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  background: #fff36a;
  box-shadow: 0 0 10px #fff36a, 0 0 24px #ffd928;
}

#message {
  min-height: 38px;
  padding: 10px 0 6px;
  font-size: 13px;
  color: #bdcbe0;
}

#startButton {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #2879f5;
  color: white;
  font-size: 15px;
  font-weight: 800;
  touch-action: none;
}

.controls {
  display: none;
}

.help {
  margin-top: 8px;
  color: #8190aa;
  font-size: 11px;
  line-height: 1.6;
}

@media (max-height: 650px) {
  body {
    padding: 6px;
  }

  h1 {
    font-size: 21px;
  }

  .subtitle {
    margin-bottom: 7px;
  }

  .stats {
    margin-bottom: 6px;
  }

  #stage {
    width: min(76vw, 360px, 43dvh);
  }

  #message {
    min-height: 28px;
    padding: 5px 0;
  }

  #startButton {
    padding: 9px;
  }

  .help {
    margin-top: 4px;
  }
}
</style>
</head>
<body>
<main class="game">
  <h1>MISSILE SURVIVOR</h1>
  <div class="subtitle">DODGE THE MISSILES. SURVIVE.</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">0.0</div>
    </div>
    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <div id="grid"></div>
    <div id="player"></div>
  </div>

  <div id="message">スタートしてミサイルを避けよう！</div>
  <button id="startButton">GAME START</button>

  <div class="controls">
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="up">↑</button>
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="left">←</button>
    <button data-dir="down">↓</button>
    <button data-dir="right">→</button>
  </div>

  <div class="help">
    画面のどこでもフリックして1マス移動<br>
    PCでは矢印キー・WASDでも操作できます
  </div>
</main>

<script>
"use strict";

const SIZE = 6;
const SPECIAL_COOLDOWN = 5000;
const SPECIAL_RANDOM_CHANCE = 1 / 30;

const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const playerElement = document.getElementById("player");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const startButton = document.getElementById("startButton");

for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  grid.appendChild(cell);
}

let player = { x: 2, y: 2 };
let missiles = [];
let specialMissiles = [];
let running = false;
let startTime = 0;
let previousTime = 0;
let lastSpawnTime = 0;
let lastSpecialSpawnTime = 0;
let score = 0;
let best = readBest();
let animationId = null;
let audioContext = null;

bestElement.textContent = best;

function readBest() {
  try {
    return Number(localStorage.getItem("missileSurvivorBest")) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    localStorage.setItem("missileSurvivorBest", String(value));
  } catch {}
}

function getLayout() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;
  const gridLeft = width * 0.125;
  const gridTop = height * 0.125;
  const gridWidth = width * 0.75;
  const gridHeight = height * 0.75;

  return {
    width,
    height,
    gridLeft,
    gridTop,
    gridWidth,
    gridHeight,
    cellWidth: gridWidth / SIZE,
    cellHeight: gridHeight / SIZE
  };
}

function drawPlayer() {
  const g = getLayout();

  playerElement.style.left =
    (g.gridLeft + player.x * g.cellWidth + 5) + "px";
  playerElement.style.top =
    (g.gridTop + player.y * g.cellHeight + 5) + "px";
  playerElement.style.width = (g.cellWidth - 10) + "px";
  playerElement.style.height = (g.cellHeight - 10) + "px";
}

function drawMissile(m) {
  m.element.style.left = (m.x - m.width / 2) + "px";
  m.element.style.top = (m.y - m.height / 2) + "px";
}

function render() {
  drawPlayer();
  for (const m of missiles) drawMissile(m);
  for (const special of specialMissiles) {
    drawSpecialMissile(special);
  }
}

function spawnMissile() {
  const g = getLayout();
  const side = Math.floor(Math.random() * 4);
  const lane = Math.floor(Math.random() * SIZE);
  const roll = Math.random();

  const type =
    roll < 3 / 4 ? "normal" :
    roll < 11 / 12 ? "fast" :
    "big";

  if (
    type === "big" &&
    missiles.filter(m => m.type === "big").length >= 2
  ) {
    return;
  }

  const dimensions = {
    normal: { width: 30, height: 18, speed: 190 },
    fast: { width: 27, height: 9, speed: 330 },
    big: { width: 120, height: 72, speed: 77 }
  };

  const d = dimensions[type];

  const m = {
    type,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: 0,
    width: d.width,
    height: d.height,
    speed: d.speed,
    element: document.createElement("div")
  };

  m.element.className = "missile " + type;

  if (side === 0) {
    m.x = -m.width / 2;
    m.y = type === "big"
      ? g.gridTop + lane * g.cellHeight
      : g.gridTop + (lane + 0.5) * g.cellHeight;
    m.vx = d.speed;
    m.angle = 0;
  } else if (side === 1) {
    m.x = g.width + m.width / 2;
    m.y = type === "big"
      ? g.gridTop + lane * g.cellHeight
      : g.gridTop + (lane + 0.5) * g.cellHeight;
    m.vx = -d.speed;
    m.angle = 180;
  } else if (side === 2) {
    m.x = type === "big"
      ? g.gridLeft + lane * g.cellWidth
      : g.gridLeft + (lane + 0.5) * g.cellWidth;
    m.y = -m.width / 2;
    m.vy = d.speed;
    m.angle = 90;
  } else {
    m.x = type === "big"
      ? g.gridLeft + lane * g.cellWidth
      : g.gridLeft + (lane + 0.5) * g.cellWidth;
    m.y = g.height + m.width / 2;
    m.vy = -d.speed;
    m.angle = -90;
  }

  m.element.style.transform = `rotate(${m.angle}deg)`;
  stage.appendChild(m.element);
  missiles.push(m);
  drawMissile(m);
}

function checkCollision() {
  const g = getLayout();

  const left = g.gridLeft + player.x * g.cellWidth;
  const right = left + g.cellWidth;
  const top = g.gridTop + player.y * g.cellHeight;
  const bottom = top + g.cellHeight;

  return missiles.some(m => {
    const vertical = m.angle === 90 || m.angle === -90;
    const w = vertical ? m.height : m.width;
    const h = vertical ? m.width : m.height;

    return (
      m.x + w / 2 > left &&
      m.x - w / 2 < right &&
      m.y + h / 2 > top &&
      m.y - h / 2 < bottom
    );
  });
}
  
function movePlayer(dx, dy) {
  if (!running) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) return;

  player.x = nx;
  player.y = ny;
  drawPlayer();

  if (checkCollision() || checkSpecialCollision()) {
    endGame();
  }
}

function playSpecialSound(frequency, duration, volume = 0.07) {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioContext) audioContext = new AudioContextClass();
    if (audioContext.state === "suspended") audioContext.resume();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "square";
    oscillator.frequency.value = frequency;
    gain.gain.value = volume;
    gain.gain.setTargetAtTime(
      0,
      audioContext.currentTime + duration,
      0.025
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration + 0.1);
  } catch {}
}

function spawnSpecialMissile() {
  const g = getLayout();
  const horizontal = Math.random() < 0.5;
  const direction = Math.random() < 0.5 ? 1 : -1;

  const special = {
    horizontal,
    direction,
    phase: "approach",
    phaseStart: 0,
    flashStep: 0,
    beamOn: false,
    targetLane: null,
    x: horizontal
      ? (direction === 1 ? -24 : g.width + 24)
      : 0,
    y: horizontal
      ? 0
      : (direction === 1 ? -24 : g.height + 24),
    speed: 250,
    squares: [
      document.createElement("div"),
      document.createElement("div")
    ],
    beam: document.createElement("div")
  };

  special.squares.forEach(square => {
    square.className = "special-square";
    stage.appendChild(square);
  });

  special.beam.className = "special-beam";
  special.beam.style.display = "none";
  stage.appendChild(special.beam);

  if (horizontal) {
    special.y = direction === 1
      ? g.gridTop - 10
      : g.gridTop + g.gridHeight + 10;
  } else {
    special.x = direction === 1
      ? g.gridLeft - 10
      : g.gridLeft + g.gridWidth + 10;
  }

  specialMissiles.push(special);
  drawSpecialMissile(special);
}

function drawSpecialMissile(special) {
  const g = getLayout();
  const size = 16;

  if (special.phase === "flash") {
    special.squares.forEach(square => {
      square.classList.toggle(
        "flash-white",
        special.flashStep === 0 || special.flashStep === 2
      );
    });
  } else {
    special.squares.forEach(square => {
      square.classList.remove("flash-white");
    });
  }

  if (special.horizontal) {
    const positions = [
      special.y,
      special.y + (special.direction === 1 ? 20 : -20)
    ];

    special.squares.forEach((square, i) => {
      square.style.left = (special.x - size / 2) + "px";
      square.style.top = (positions[i] - size / 2) + "px";
    });
  } else {
    const positions = [
      special.x,
      special.x + (special.direction === 1 ? 20 : -20)
    ];

    special.squares.forEach((square, i) => {
      square.style.left = (positions[i] - size / 2) + "px";
      square.style.top = (special.y - size / 2) + "px";
    });
  }

  drawSpecialBeam(special, g);
}

function drawSpecialBeam(special, g = getLayout()) {
  if (special.phase !== "beam" || !special.beamOn) {
    special.beam.style.display = "none";
    return;
  }

  special.beam.style.display = "block";

  if (special.horizontal) {
    const x = g.gridLeft + (special.targetLane + 0.5) * g.cellWidth;
    special.beam.style.left = (x - 3) + "px";
    special.beam.style.top = g.gridTop + "px";
    special.beam.style.width = "6px";
    special.beam.style.height = g.gridHeight + "px";
  } else {
    const y = g.gridTop + (special.targetLane + 0.5) * g.cellHeight;
    special.beam.style.left = g.gridLeft + "px";
    special.beam.style.top = (y - 3) + "px";
    special.beam.style.width = g.gridWidth + "px";
    special.beam.style.height = "6px";
  }
}

function beginSpecialFlash(special, now) {
  special.phase = "flash";
  special.phaseStart = now;
  special.flashStep = 0;
  playSpecialSound(740, 0.12);
}

function detectPlayer(special, now) {
  if (special.phase !== "approach") return;

  const g = getLayout();
  const playerCenterX =
    g.gridLeft + (player.x + 0.5) * g.cellWidth;
  const playerCenterY =
    g.gridTop + (player.y + 0.5) * g.cellHeight;

  if (special.horizontal) {
    const distance = playerCenterX - special.x;

    if (
      Math.abs(distance) <= special.speed * 0.05 + 1 &&
      Math.sign(distance) === special.direction
    ) {
      special.x = playerCenterX;
      special.targetLane = player.x;
      beginSpecialFlash(special, now);
    }
  } else {
    const distance = playerCenterY - special.y;

    if (
      Math.abs(distance) <= special.speed * 0.05 + 1 &&
      Math.sign(distance) === special.direction
    ) {
      special.y = playerCenterY;
      special.targetLane = player.y;
      beginSpecialFlash(special, now);
    }
  }
}

function updateSpecialMissiles(now, dt) {
  const g = getLayout();
  const remaining = [];

  for (const special of specialMissiles) {
    if (special.phase === "approach") {
      if (special.horizontal) {
        special.x += special.direction * special.speed * dt;
      } else {
        special.y += special.direction * special.speed * dt;
      }

      detectPlayer(special, now);

      const outside = special.horizontal
        ? (
            special.direction === 1
              ? special.x > g.width + 30
              : special.x < -30
          )
        : (
            special.direction === 1
              ? special.y > g.height + 30
              : special.y < -30
          );

      if (outside && special.phase === "approach") {
        removeSpecialMissile(special);
        continue;
      }
    } else if (special.phase === "flash") {
      const elapsed = now - special.phaseStart;
      special.flashStep = Math.min(3, Math.floor(elapsed / 150));

      if (elapsed >= 600) {
        special.phase = "beam";
        special.phaseStart = now;
        special.beamOn = true;
        playSpecialSound(980, 0.22, 0.09);
      }
    } else if (special.phase === "beam") {
      const elapsed = now - special.phaseStart;

      if (elapsed < 1050) {
        special.beamOn =
          elapsed < 180 ||
          (elapsed >= 300 && elapsed < 420) ||
          (elapsed >= 540 && elapsed < 660) ||
          elapsed >= 780;

        if (elapsed >= 780 && elapsed < 800) {
          playSpecialSound(560, 0.1, 0.045);
        }
      } else {
        removeSpecialMissile(special);
        continue;
      }
    }

    drawSpecialMissile(special, g);
    remaining.push(special);
  }

  specialMissiles = remaining;
}

function removeSpecialMissile(special) {
  special.squares.forEach(square => square.remove());
  special.beam.remove();
}

function checkSpecialCollision() {
  return specialMissiles.some(special => {
    if (special.phase !== "beam" || !special.beamOn) {
      return false;
    }

    if (special.horizontal) {
      return player.x === special.targetLane;
    }

    return player.y === special.targetLane;
  });
}

function gameLoop(now) {
  if (!running) return;

  const elapsed = (now - startTime) / 1000;
  const dt = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;

  score = Math.floor(elapsed * 10);
  scoreElement.textContent = score;
  timeElement.textContent = elapsed.toFixed(1);

  const spawnInterval = Math.max(180, 600 - elapsed * 7);
  const speedFactor = Math.min(2.2, 1 + elapsed * 0.012);

  if (now - lastSpawnTime >= spawnInterval) {
    spawnMissile();
    lastSpawnTime = now;

    if (Math.random() < SPECIAL_RANDOM_CHANCE) {
      spawnSpecialMissile();
    }
  }

  if (now - lastSpecialSpawnTime >= SPECIAL_COOLDOWN) {
    spawnSpecialMissile();
    lastSpecialSpawnTime = now;
  }

  const g = getLayout();
  const remaining = [];

  for (const m of missiles) {
    m.x += m.vx * speedFactor * dt;
    m.y += m.vy * speedFactor * dt;

    
const vertical = m.angle === 90 || m.angle === -90;
const w = vertical ? m.height : m.width;
const h = vertical ? m.width : m.height;

const outside =
  m.x + w / 2 < 0 ||
  m.x - w / 2 > g.width ||
  m.y + h / 2 < 0 ||
  m.y - h / 2 > g.height;

    if (outside) {
      m.element.remove();
    } else {
      remaining.push(m);
    }
  }

  missiles = remaining;

  updateSpecialMissiles(now, dt);

  if (checkCollision() || checkSpecialCollision()) {
    endGame();
    return;
  }

  render();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  for (const m of missiles) {
    m.element.remove();
  }

  for (const special of specialMissiles) {
    removeSpecialMissile(special);
  }

  missiles = [];
  specialMissiles = [];
  player = { x: 2, y: 2 };
  score = 0;
  running = true;

  startTime = performance.now();
  previousTime = startTime;
  lastSpawnTime = startTime;
  lastSpecialSpawnTime = startTime;

  scoreElement.textContent = "0";
  timeElement.textContent = "0.0";
  messageElement.textContent = "四方からのミサイルを避けろ！";
  startButton.textContent = "RESTART";

  render();
  animationId = requestAnimationFrame(gameLoop);
}

function endGame() {
  if (!running) return;

  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (score > best) {
    best = score;
    saveBest(best);
    bestElement.textContent = best;
    messageElement.textContent = "NEW BEST! スコア：" + score;
  } else {
    messageElement.textContent = "GAME OVER！ スコア：" + score;
  }

  startButton.textContent = "TRY AGAIN";
}

const directions = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

function handleDirection(direction) {
  const [dx, dy] = directions[direction];
  movePlayer(dx, dy);
}

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    handleDirection(button.dataset.dir);
  });
});

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const keyMap = {
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right"
  };

  const direction = keyMap[key];

  if (direction && running) {
    event.preventDefault();
    handleDirection(direction);
  }
});

let touchStartX = 0;
let touchStartY = 0;
let touchActive = false;

document.addEventListener("touchstart", event => {
  if (!running || event.changedTouches.length === 0) return;

  const touch = event.changedTouches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchActive = true;

  event.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", event => {
  event.preventDefault();
}, { passive: false });

document.addEventListener("touchend", event => {
  if (!running || !touchActive || event.changedTouches.length === 0) {
    touchActive = false;
    return;
  }

  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  touchActive = false;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    handleDirection(dx > 0 ? "right" : "left");
  } else {
    handleDirection(dy > 0 ? "down" : "up");
  }

  event.preventDefault();
}, { passive: false });

document.addEventListener("touchcancel", () => {
  touchActive = false;
}, { passive: false });

startButton.addEventListener("click", startGame);
window.addEventListener("resize", render);

render();
</script>
</body>
</html>
