
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MISSILE SURVIVOR</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  color-scheme: dark;
  --background: #101522;
  --grid-line: #aebbd0;
  --grid-background: #385d96;
  --missile-color: #ed1472;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--background);
  color: #f4f7ff;
  font-family: system-ui, -apple-system, sans-serif;
  overscroll-behavior: none;
}

.game {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

h1 {
  font-size: 27px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #95a7c4;
  margin-bottom: 20px;
}

.stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 3px 14px;
}

.stat {
  min-width: 65px;
}

.stat-label {
  color: #95a7c4;
  font-size: 10px;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* ステージとグリッドは独立させる */
#stage {
  position: relative;
  width: min(100%, 360px);
  aspect-ratio: 1;
  margin: 0 auto;
  overflow: hidden;
  background: #26364f;
  border: 1px solid #354968;
  border-radius: 8px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#grid {
  position: absolute;
  left: 12.5%;
  top: 12.5%;
  width: 75%;
  height: 75%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  background: var(--grid-background);
  border: 2px solid var(--grid-line);
  z-index: 1;
  pointer-events: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-right: 2px solid var(--grid-line);
  border-bottom: 2px solid var(--grid-line);
}

.cell:nth-child(6n) {
  border-right: 0;
}

.cell:nth-last-child(-n + 6) {
  border-bottom: 0;
}

/* プレイヤー */
#player {
  position: absolute;
  width: 0;
  height: 0;
  background: #05080e;
  border: 2px solid #101522;
  border-radius: 5px;
  z-index: 4;
  pointer-events: none;
  transition: left 55ms linear, top 55ms linear;
}

#player::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  border: 2px solid #d7e8ff;
}

/*
  ミサイルは長方形の胴体と半円状の先端。
  形そのものは横向きで作り、進行方向に回転させる。
*/
.missile {
  position: absolute;
  width: 30px;
  height: 18px;
  background: var(--missile-color);
  border-radius: 0 50% 50% 0;
  z-index: 5;
  pointer-events: none;
  will-change: left, top, transform;
  transform-origin: center center;
}

/* 情報表示 */
#message {
  min-height: 42px;
  padding: 12px 0 7px;
  font-size: 13px;
  color: #bdcbe0;
}

#startButton {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2879f5;
  color: white;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

#startButton:active {
  transform: scale(0.985);
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  justify-content: center;
  gap: 7px;
  margin-top: 15px;
}

.controls button {
  height: 46px;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: #29364b;
  color: white;
  font-size: 22px;
  touch-action: manipulation;
}

.controls .empty {
  visibility: hidden;
}

.help {
  margin-top: 13px;
  color: #8190aa;
  font-size: 11px;
  line-height: 1.8;
}

@media (min-width: 600px) {
  .controls {
    display: none;
  }
}
</style>
</head>

<body>
<main class="game">
  <h1>MISSILE SURVIVOR</h1>
  <div class="subtitle">DODGE THE MISSILES. SURVIVE.</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">0.0</div>
    </div>
    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <div id="grid"></div>
    <div id="player"></div>
  </div>

  <div id="message">スタートしてミサイルを避けよう！</div>
  <button id="startButton">GAME START</button>

  <div class="controls">
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="up" aria-label="上へ">↑</button>
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="left" aria-label="左へ">←</button>
    <button data-dir="down" aria-label="下へ">↓</button>
    <button data-dir="right" aria-label="右へ">→</button>
  </div>

  <div class="help">
    スワイプで上下左右に移動<br>
    PCでは矢印キー・WASDでも操作できます
  </div>
</main>

<script>
"use strict";

const SIZE = 6;

const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const playerElement = document.getElementById("player");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const startButton = document.getElementById("startButton");

// グリッドは最初に一度だけ作る
for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  grid.appendChild(cell);
}

let player = { x: 2, y: 2 };
let missiles = [];

let running = false;
let startTime = 0;
let previousTime = 0;
let lastSpawnTime = 0;
let score = 0;
let best = readBest();
let animationId = null;

bestElement.textContent = best;

function readBest() {
  try {
    return Number(localStorage.getItem("missileSurvivorBest")) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    localStorage.setItem("missileSurvivorBest", String(value));
  } catch {
    // 保存できなくてもゲームは続行する
  }
}

// ステージの寸法から固定グリッドの座標を求める
function getLayout() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;

  const gridLeft = width * 0.125;
  const gridTop = height * 0.125;
  const gridWidth = width * 0.75;
  const gridHeight = height * 0.75;

  return {
    width,
    height,
    gridLeft,
    gridTop,
    gridWidth,
    gridHeight,
    cellWidth: gridWidth / SIZE,
    cellHeight: gridHeight / SIZE
  };
}

// プレイヤーをマスの中央に配置する
function drawPlayer() {
  const g = getLayout();

  const cellWidth = g.cellWidth;
  const cellHeight = g.cellHeight;

  playerElement.style.left =
    (g.gridLeft + player.x * cellWidth + 5) + "px";

  playerElement.style.top =
    (g.gridTop + player.y * cellHeight + 5) + "px";

  playerElement.style.width = (cellWidth - 10) + "px";
  playerElement.style.height = (cellHeight - 10) + "px";
}

// ミサイルの位置を更新する
function drawMissile(m) {
  m.element.style.left = (m.x - 15) + "px";
  m.element.style.top = (m.y - 9) + "px";
}

function render() {
  drawPlayer();
  for (const m of missiles) {
    drawMissile(m);
  }
}

// 四方の外側からミサイルを発射
function spawnMissile() {
  const g = getLayout();

  const side = Math.floor(Math.random() * 4);
  const lane = Math.floor(Math.random() * SIZE);

  const m = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: 0,
    element: document.createElement("div")
  };

  m.element.className = "missile";

  if (side === 0) {
    // 左から右
    m.x = -15;
    m.y = g.gridTop + (lane + 0.5) * g.cellHeight;
    m.vx = 190;
    m.angle = 0;
  } else if (side === 1) {
    // 右から左
    m.x = g.width + 15;
    m.y = g.gridTop + (lane + 0.5) * g.cellHeight;
    m.vx = -190;
    m.angle = 180;
  } else if (side === 2) {
    // 上から下
    m.x = g.gridLeft + (lane + 0.5) * g.cellWidth;
    m.y = -15;
    m.vy = 190;
    m.angle = 90;
  } else {
    // 下から上
    m.x = g.gridLeft + (lane + 0.5) * g.cellWidth;
    m.y = g.height + 15;
    m.vy = -190;
    m.angle = -90;
  }

  // 要素は常に30×18。回転しても形は変形しない。
  m.element.style.transform = `rotate(${m.angle}deg)`;

  stage.appendChild(m.element);
  missiles.push(m);
  drawMissile(m);
}

// プレイヤーの移動
function movePlayer(dx, dy) {
  if (!running) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) {
    return;
  }

  player.x = nx;
  player.y = ny;

  drawPlayer();

  if (checkCollision()) {
    endGame();
  }
}

// 衝突判定。縦向きのミサイルは当たり判定も縦長にする。
function checkCollision() {
  const g = getLayout();

  const left = g.gridLeft + player.x * g.cellWidth;
  const right = left + g.cellWidth;
  const top = g.gridTop + player.y * g.cellHeight;
  const bottom = top + g.cellHeight;

  return missiles.some(m => {
    const vertical = m.angle === 90 || m.angle === -90;
    const hitWidth = vertical ? 18 : 30;
    const hitHeight = vertical ? 30 : 18;

    return (
      m.x + hitWidth / 2 > left &&
      m.x - hitWidth / 2 < right &&
      m.y + hitHeight / 2 > top &&
      m.y - hitHeight / 2 < bottom
    );
  });
}

// ゲームループ
function gameLoop(now) {
  if (!running) return;

  const elapsed = (now - startTime) / 1000;
  const dt = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;

  score = Math.floor(elapsed * 10);
  scoreElement.textContent = score;
  timeElement.textContent = elapsed.toFixed(1);

  // 発射間隔を短縮してミサイルを増やす
  const spawnInterval = Math.max(180, 600 - elapsed * 7);

  // 生存するほど速くなる
  const speedFactor = Math.min(2.2, 1 + elapsed * 0.012);

  if (now - lastSpawnTime >= spawnInterval) {
    spawnMissile();
    lastSpawnTime = now;
  }

  const g = getLayout();
  const remaining = [];

  for (const m of missiles) {
    m.x += m.vx * speedFactor * dt;
    m.y += m.vy * speedFactor * dt;

    const outside =
      m.x + 30 < 0 ||
      m.x - 30 > g.width ||
      m.y + 30 < 0 ||
      m.y - 30 > g.height;

    if (outside) {
      m.element.remove();
    } else {
      remaining.push(m);
    }
  }

  missiles = remaining;

  if (checkCollision()) {
    endGame();
    return;
  }

  render();
  animationId = requestAnimationFrame(gameLoop);
}

// ゲーム開始
function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  for (const m of missiles) {
    m.element.remove();
  }

  missiles = [];
  player = { x: 2, y: 2 };
  score = 0;
  running = true;

  startTime = performance.now();
  previousTime = startTime;
  lastSpawnTime = startTime;

  scoreElement.textContent = "0";
  timeElement.textContent = "0.0";
  messageElement.textContent = "四方からのミサイルを避けろ！";
  startButton.textContent = "RESTART";

  render();
  animationId = requestAnimationFrame(gameLoop);
}

// ゲームオーバー
function endGame() {
  if (!running) return;

  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (score > best) {
    best = score;
    saveBest(best);
    bestElement.textContent = best;
    messageElement.textContent = "NEW BEST! スコア：" + score;
  } else {
    messageElement.textContent = "GAME OVER！ スコア：" + score;
  }

  startButton.textContent = "TRY AGAIN";
}

// 方向操作
const directions = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

function handleDirection(direction) {
  const [dx, dy] = directions[direction];
  movePlayer(dx, dy);
}

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    handleDirection(button.dataset.dir);
  });
});

// PCのキーボード操作
document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const keyMap = {
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right"
  };

  const direction = keyMap[key];

  if (direction && running) {
    event.preventDefault();
    handleDirection(direction);
  }
});

// スマホのスワイプ操作
let pointerStartX = 0;
let pointerStartY = 0;
let pointerId = null;

stage.addEventListener("pointerdown", event => {
  if (!running) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  pointerStartX = event.clientX;
  pointerStartY = event.clientY;
  pointerId = event.pointerId;

  // 指が盤面の外に移動しても pointerup を受け取る
  try {
    stage.setPointerCapture(event.pointerId);
  } catch (_) {
    // 対応していない環境では通常のイベント処理を使う
  }

  event.preventDefault();
});

stage.addEventListener("pointerup", event => {
  if (!running || pointerId !== event.pointerId) return;

  const dx = event.clientX - pointerStartX;
  const dy = event.clientY - pointerStartY;

  pointerId = null;

  const distance = Math.max(Math.abs(dx), Math.abs(dy));

  if (distance < 12) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    handleDirection(dx > 0 ? "right" : "left");
  } else {
    handleDirection(dy > 0 ? "down" : "up");
  }

  event.preventDefault();
});

stage.addEventListener("pointercancel", () => {
  pointerId = null;
});

startButton.addEventListener("click", startGame);

window.addEventListener("resize", render);

render();
</script>
</body>
</html>
