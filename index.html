
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MISSILE SURVIVOR</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  color-scheme: dark;
  --background: #101522;
  --panel: #1c273a;
  --grid-line: #aebbd0;
  --grid-background: #385d96;
  --player-color: #05080e;
  --missile-color: #ed1472;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--background);
  color: #f4f7ff;
  font-family: system-ui, -apple-system, sans-serif;
  overscroll-behavior: none;
}

.game {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

h1 {
  font-size: 27px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #95a7c4;
  margin-bottom: 20px;
}

.stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 3px 14px;
}

.stat {
  min-width: 65px;
}

.stat-label {
  color: #95a7c4;
  font-size: 10px;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/*
  STAGE:
  グリッドとミサイルを配置する固定比率の領域。
  グリッド自体は常に中央の75%を占める。
*/
#stage {
  position: relative;
  width: min(100%, 360px);
  aspect-ratio: 1;
  margin: 0 auto;
  overflow: visible;
  background: #26364f;
  border: 1px solid #354968;
  border-radius: 8px;
  touch-action: none;
  user-select: none;
}

/*
  GRID:
  グリッドの大きさは常にステージの75%。
  6列×6行をCSS Gridで固定する。
*/
#grid {
  position: absolute;
  left: 12.5%;
  top: 12.5%;
  width: 75%;
  height: 75%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  background: var(--grid-background);
  border: 2px solid var(--grid-line);
  z-index: 1;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-right: 2px solid var(--grid-line);
  border-bottom: 2px solid var(--grid-line);
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell:nth-child(6n) {
  border-right: 0;
}

.cell:nth-last-child(-n + 6) {
  border-bottom: 0;
}

/* プレイヤーはマスの内側に固定して表示 */
#player {
  position: absolute;
  width: calc(100% / 6 - 14px);
  height: calc(100% / 6 - 14px);
  background: var(--player-color);
  border: 2px solid #101522;
  border-radius: 5px;
  z-index: 4;
  pointer-events: none;
  transition: left 65ms linear, top 65ms linear;
}

#player::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  border: 2px solid #d7e8ff;
}

/*
  MISSILES:
  グリッドとは独立した要素。
  マスのサイズやグリッドの線に影響しない。
*/
.missile {
  position: absolute;
  width: 30px;
  height: 14px;
  background: var(--missile-color);
  clip-path: polygon(
    0 25%,
    68% 25%,
    68% 0,
    100% 50%,
    68% 100%,
    68% 75%,
    0 75%
  );
  z-index: 5;
  pointer-events: none;
  will-change: left, top;
}

.missile.vertical {
  width: 14px;
  height: 30px;
}

.missile.warning {
  filter: drop-shadow(0 0 4px #ff65a8);
}

#message {
  min-height: 42px;
  padding: 12px 0 7px;
  font-size: 13px;
  color: #bdcbe0;
}

#startButton {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #2879f5;
  color: white;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

#startButton:active {
  transform: scale(0.985);
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  justify-content: center;
  gap: 7px;
  margin-top: 15px;
}

.controls button {
  height: 46px;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: #29364b;
  color: white;
  font-size: 22px;
  touch-action: manipulation;
}

.controls .empty {
  visibility: hidden;
}

.help {
  margin-top: 13px;
  color: #8190aa;
  font-size: 11px;
  line-height: 1.8;
}

@media (min-width: 600px) {
  .controls {
    display: none;
  }
}
</style>
</head>

<body>
<main class="game">
  <h1>MISSILE SURVIVOR</h1>
  <div class="subtitle">DODGE THE MISSILES. SURVIVE.</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">0.0</div>
    </div>

    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <div id="grid"></div>
    <div id="player"></div>
  </div>

  <div id="message">スタートしてミサイルを避けよう！</div>
  <button id="startButton">GAME START</button>

  <div class="controls">
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="up" aria-label="上へ">↑</button>
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="left" aria-label="左へ">←</button>
    <button data-dir="down" aria-label="下へ">↓</button>
    <button data-dir="right" aria-label="右へ">→</button>
  </div>

  <div class="help">
    スワイプで上下左右に移動<br>
    PCでは矢印キー・WASDでも操作できます
  </div>
</main>

<script>
"use strict";

const SIZE = 6;

const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const playerElement = document.getElementById("player");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const startButton = document.getElementById("startButton");

// グリッドのマスは最初に一度だけ生成する
for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  grid.appendChild(cell);
}

let player = { x: 2, y: 2 };
let missiles = [];

let running = false;
let startTime = 0;
let previousTime = 0;
let lastSpawnTime = 0;
let lastMoveTime = 0;
let score = 0;
let best = readBest();
let animationId = null;
let nextMissileId = 0;

bestElement.textContent = best;

function readBest() {
  try {
    return Number(localStorage.getItem("missileSurvivorBest")) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    localStorage.setItem("missileSurvivorBest", String(value));
  } catch {
    // 保存できない環境でもゲームは続行できる
  }
}

// ステージの大きさからグリッドの位置を計算する。
// グリッドのサイズは常にステージの75%。
function getLayout() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;

  const gridLeft = width * 0.125;
  const gridTop = height * 0.125;
  const gridWidth = width * 0.75;
  const gridHeight = height * 0.75;

  return {
    width,
    height,
    gridLeft,
    gridTop,
    gridWidth,
    gridHeight,
    cellWidth: gridWidth / SIZE,
    cellHeight: gridHeight / SIZE
  };
}

// プレイヤーを指定したマスの中央に配置する
function drawPlayer() {
  const g = getLayout();

  const cellWidth = g.cellWidth;
  const cellHeight = g.cellHeight;

  playerElement.style.left =
    (g.gridLeft + player.x * cellWidth + 7) + "px";

  playerElement.style.top =
    (g.gridTop + player.y * cellHeight + 7) + "px";

  playerElement.style.width = (cellWidth - 14) + "px";
  playerElement.style.height = (cellHeight - 14) + "px";
}

// ゲームの状態を表示する
function renderMissiles() {
  for (const m of missiles) {
    m.element.style.left = (m.x - m.width / 2) + "px";
    m.element.style.top = (m.y - m.height / 2) + "px";
  }
}

function render() {
  drawPlayer();
  renderMissiles();
}

// 新しいミサイルを作る。
// side: left / right / top / bottom
function spawnMissile(now) {
  const g = getLayout();

  const side = ["left", "right", "top", "bottom"][
    Math.floor(Math.random() * 4)
  ];

  const lane = Math.floor(Math.random() * SIZE);

  const horizontal = side === "left" || side === "right";

  const missile = {
    id: nextMissileId++,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    width: horizontal ? 30 : 14,
    height: horizontal ? 14 : 30,
    element: document.createElement("div")
  };

  missile.element.className =
    horizontal ? "missile" : "missile vertical";

  if (side === "left") {
    missile.x = -missile.width / 2;
    missile.y = g.gridTop + (lane + 0.5) * g.cellHeight;
    missile.vx = 155;
  } else if (side === "right") {
    missile.x = g.width + missile.width / 2;
    missile.y = g.gridTop + (lane + 0.5) * g.cellHeight;
    missile.vx = -155;
    missile.element.style.transform = "rotate(180deg)";
  } else if (side === "top") {
    missile.x = g.gridLeft + (lane + 0.5) * g.cellWidth;
    missile.y = -missile.height / 2;
    missile.vy = 155;
    missile.element.style.transform = "rotate(90deg)";
  } else {
    missile.x = g.gridLeft + (lane + 0.5) * g.cellWidth;
    missile.y = g.height + missile.height / 2;
    missile.vy = -155;
    missile.element.style.transform = "rotate(-90deg)";
  }

  stage.appendChild(missile.element);
  missiles.push(missile);

  // 発射した直後から位置を反映する
  missile.element.style.left =
    (missile.x - missile.width / 2) + "px";
  missile.element.style.top =
    (missile.y - missile.height / 2) + "px";
}

// プレイヤーの移動
function movePlayer(dx, dy) {
  if (!running) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  // 盤面の外には出られない
  if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) {
    return;
  }

  player.x = nx;
  player.y = ny;

  drawPlayer();

  if (checkCollision()) {
    endGame();
  }
}

// ミサイルの位置がプレイヤーのマスに入ったら衝突
function checkCollision() {
  const g = getLayout();

  const left = g.gridLeft + player.x * g.cellWidth;
  const right = left + g.cellWidth;
  const top = g.gridTop + player.y * g.cellHeight;
  const bottom = top + g.cellHeight;

  return missiles.some(m =>
    m.x + m.width / 2 > left &&
    m.x - m.width / 2 < right &&
    m.y + m.height / 2 > top &&
    m.y - m.height / 2 < bottom
  );
}

// メインゲームループ
function gameLoop(now) {
  if (!running) return;

  const elapsed = (now - startTime) / 1000;
  const dt = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;

  score = Math.floor(elapsed * 10);

  scoreElement.textContent = score;
  timeElement.textContent = elapsed.toFixed(1);

  // 生き残るほど発射頻度を上げる
  const spawnInterval = Math.max(380, 1050 - elapsed * 9);

  // 生き残るほど移動速度も上げる
  const speedFactor = Math.min(2.2, 1 + elapsed * 0.012);

  if (now - lastSpawnTime >= spawnInterval) {
    spawnMissile(now);
    lastSpawnTime = now;
  }

  // ミサイルを移動する
  for (const m of missiles) {
    m.x += m.vx * speedFactor * dt;
    m.y += m.vy * speedFactor * dt;
  }

  // ステージを完全に通過したミサイルを削除
  const g = getLayout();

  const remaining = [];

  for (const m of missiles) {
    const outside =
      m.x + m.width / 2 < 0 ||
      m.x - m.width / 2 > g.width ||
      m.y + m.height / 2 < 0 ||
      m.y - m.height / 2 > g.height;

    if (outside) {
      m.element.remove();
    } else {
      remaining.push(m);
    }
  }

  missiles = remaining;

  // ミサイルがプレイヤーに衝突したか判定
  if (checkCollision()) {
    endGame();
    return;
  }

  render();

  animationId = requestAnimationFrame(gameLoop);
}

// ゲーム開始・リスタート
function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  for (const m of missiles) {
    m.element.remove();
  }

  missiles = [];
  player = { x: 2, y: 2 };
  score = 0;
  running = true;

  startTime = performance.now();
  previousTime = startTime;
  lastSpawnTime = startTime;
  lastMoveTime = startTime;

  scoreElement.textContent = "0";
  timeElement.textContent = "0.0";
  messageElement.textContent = "四方からのミサイルを避けろ！";
  startButton.textContent = "RESTART";

  render();

  animationId = requestAnimationFrame(gameLoop);
}

// ゲームオーバー
function endGame() {
  if (!running) return;

  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (score > best) {
    best = score;
    saveBest(best);
    bestElement.textContent = best;
    messageElement.textContent =
      "NEW BEST! スコア：" + score;
  } else {
    messageElement.textContent =
      "GAME OVER！ スコア：" + score;
  }

  startButton.textContent = "TRY AGAIN";
}

// 方向入力
const directions = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

function handleDirection(direction) {
  const [dx, dy] = directions[direction];
  movePlayer(dx, dy);
}

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    handleDirection(button.dataset.dir);
  });
});

// PCのキーボード操作
document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const keyMap = {
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right"
  };

  const direction = keyMap[key];

  if (direction && running) {
    event.preventDefault();
    handleDirection(direction);
  }
});

// スワイプ操作
let pointerStartX = 0;
let pointerStartY = 0;
let pointerId = null;

stage.addEventListener("pointerdown", event => {
  if (!running) return;

  pointerStartX = event.clientX;
  pointerStartY = event.clientY;
  pointerId = event.pointerId;
});

stage.addEventListener("pointerup", event => {
  if (!running || pointerId !== event.pointerId) return;

  const dx = event.clientX - pointerStartX;
  const dy = event.clientY - pointerStartY;

  pointerId = null;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) {
    return;
  }

  if (Math.abs(dx) > Math.abs(dy)) {
    handleDirection(dx > 0 ? "right" : "left");
  } else {
    handleDirection(dy > 0 ? "down" : "up");
  }
});

stage.addEventListener("pointercancel", () => {
  pointerId = null;
});

startButton.addEventListener("click", startGame);

// 画面サイズ変更時もグリッドの比率を維持する
window.addEventListener("resize", render);

// 初期表示
render();
</script>
</body>
</html>
