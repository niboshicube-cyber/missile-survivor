
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MISSILE SURVIVOR</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101522;
  color: #f4f7ff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 14px;
  overscroll-behavior: none;
}

.game {
  width: 100%;
  max-width: 440px;
  text-align: center;
}

h1 {
  font-size: 27px;
  letter-spacing: 2px;
  margin: 0 0 6px;
}

.subtitle {
  font-size: 12px;
  color: #9caac4;
  margin-bottom: 22px;
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 0 4px;
}

.stat-label {
  font-size: 11px;
  color: #9caac4;
}

.stat-value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#board {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 5px;
  padding: 7px;
  background: #1d273a;
  border: 1px solid #33415c;
  border-radius: 12px;
  touch-action: none;
  user-select: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-radius: 5px;
  background: #29364b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(19px, 6vw, 29px);
  position: relative;
}

.player {
  background: #1768dc;
  box-shadow: inset 0 0 0 2px #75b5ff;
}

.missile {
  background: #682631;
  color: #ff7885;
  box-shadow: inset 0 0 0 1px #ed5268;
}

.warning {
  background: #5a4720;
  color: #ffdf70;
  animation: blink 0.35s infinite alternate;
}

@keyframes blink {
  from { opacity: 0.55; }
  to { opacity: 1; }
}

#message {
  min-height: 44px;
  padding: 13px 0 7px;
  color: #b6c3da;
  font-size: 13px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 22px;
  font-size: 15px;
  font-weight: 750;
  cursor: pointer;
}

#startButton {
  width: 100%;
  color: white;
  background: #2879f5;
  margin-top: 5px;
}

#startButton:active {
  transform: scale(0.98);
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  justify-content: center;
  gap: 7px;
  margin: 17px auto 0;
}

.controls button {
  padding: 0;
  height: 48px;
  font-size: 22px;
  color: #f4f7ff;
  background: #29364b;
  touch-action: manipulation;
}

.controls .empty {
  visibility: hidden;
}

.help {
  color: #8190aa;
  font-size: 11px;
  line-height: 1.8;
  margin-top: 15px;
}

@media (min-width: 600px) {
  .controls { display: none; }
}
</style>
</head>
<body>
<main class="game">
  <h1>MISSILE SURVIVOR</h1>
  <div class="subtitle">DODGE THE MISSILES. SURVIVE.</div>

  <div class="stats">
    <div>
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div>
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">0.0</div>
    </div>
    <div>
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="board" aria-label="6×6ゲーム盤"></div>

  <div id="message">スタートしてミサイルを避けよう！</div>
  <button id="startButton">GAME START</button>

  <div class="controls">
    <button class="empty">　</button>
    <button data-dir="up" aria-label="上">↑</button>
    <button class="empty">　</button>
    <button data-dir="left" aria-label="左">←</button>
    <button data-dir="down" aria-label="下">↓</button>
    <button data-dir="right" aria-label="右">→</button>
  </div>

  <div class="help">
    スワイプまたは方向ボタンで移動<br>
    PCでは矢印キー・WASDでも操作できます
  </div>
</main>

<script>
"use strict";

const SIZE = 6;
const board = document.getElementById("board");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const startButton = document.getElementById("startButton");

let player = { x: 2, y: 2 };
let missiles = [];
let warnings = [];
let running = false;
let startTime = 0;
let lastFrame = 0;
let lastMove = 0;
let lastSpawn = 0;
let score = 0;
let animationId = null;
let best = Number(localStorage.getItem("missileSurvivorBest") || 0);

bestElement.textContent = best;

// 盤面のマスを作る
const cells = [];

for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  board.appendChild(cell);
  cells.push(cell);
}

// ゲームを初期化して開始
function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  player = { x: 2, y: 2 };
  missiles = [];
  warnings = [];
  score = 0;
  running = true;

  startTime = performance.now();
  lastFrame = startTime;
  lastMove = startTime;
  lastSpawn = startTime;

  scoreElement.textContent = "0";
  timeElement.textContent = "0.0";
  messageElement.textContent = "ミサイル接近中！";
  startButton.textContent = "RESTART";

  render();
  animationId = requestAnimationFrame(gameLoop);
}

// 位置が盤面内か判定
function inside(x, y) {
  return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
}

// プレイヤーを移動
function movePlayer(dx, dy) {
  if (!running) return;

  const now = performance.now();

  // 連続入力が速すぎる場合の制限
  if (now - lastMove < 75) return;
  lastMove = now;

  const nx = player.x + dx;
  const ny = player.y + dy;

  // 盤面の外には移動できない
  if (!inside(nx, ny)) return;

  player = { x: nx, y: ny };

  // ミサイルがいるマスに移動したら終了
  if (missiles.some(m => m.x === player.x && m.y === player.y)) {
    endGame();
    return;
  }

  render();
}

// ミサイルの発射予告を作る
function spawnMissile(now) {
  const side = Math.floor(Math.random() * 4);
  let x, y, dx, dy;

  if (side === 0) {
    // 上から下へ
    x = Math.floor(Math.random() * SIZE);
    y = 0;
    dx = 0;
    dy = 1;
  } else if (side === 1) {
    // 下から上へ
    x = Math.floor(Math.random() * SIZE);
    y = SIZE - 1;
    dx = 0;
    dy = -1;
  } else if (side === 2) {
    // 左から右へ
    x = 0;
    y = Math.floor(Math.random() * SIZE);
    dx = 1;
    dy = 0;
  } else {
    // 右から左へ
    x = SIZE - 1;
    y = Math.floor(Math.random() * SIZE);
    dx = -1;
    dy = 0;
  }

  warnings.push({
    x, y, dx, dy,
    createdAt: now
  });
}

// 予告が終わったらミサイルを発射
function launchMissiles(now) {
  const remaining = [];

  for (const w of warnings) {
    if (now - w.createdAt >= 450) {
      // 発射時点でプレイヤーと重なっていたら終了
      if (w.x === player.x && w.y === player.y) {
        endGame();
        return;
      }

      missiles.push({
        x: w.x,
        y: w.y,
        dx: w.dx,
        dy: w.dy
      });
    } else {
      remaining.push(w);
    }
  }

  warnings = remaining;
}

// ミサイルを一斉に1マス進める
function advanceMissiles() {
  const next = [];

  for (const m of missiles) {
    m.x += m.dx;
    m.y += m.dy;

    // 盤面の外に出たミサイルは消える
    if (!inside(m.x, m.y)) continue;

    // プレイヤーに命中
    if (m.x === player.x && m.y === player.y) {
      endGame();
      return;
    }

    next.push(m);
  }

  missiles = next;
}

// 描画
function render() {
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const cell = cells[y * SIZE + x];

      cell.className = "cell";
      cell.textContent = "";

      const isPlayer = player.x === x && player.y === y;
      const isMissile = missiles.some(m => m.x === x && m.y === y);
      const isWarning = warnings.some(w => w.x === x && w.y === y);

      if (isPlayer) {
        cell.classList.add("player");
        cell.textContent = "◆";
      } else if (isMissile) {
        cell.classList.add("missile");
        cell.textContent = "➤";
      } else if (isWarning) {
        cell.classList.add("warning");
        cell.textContent = "!";
      }
    }
  }
}

// メインループ
function gameLoop(now) {
  if (!running) return;

  const elapsed = (now - startTime) / 1000;
  score = Math.floor(elapsed * 10);

  scoreElement.textContent = score;
  timeElement.textContent = elapsed.toFixed(1);

  // 生存時間に応じてミサイルが速くなる
  const moveInterval = Math.max(230, 650 - elapsed * 5);

  // ミサイルの発射間隔も徐々に短くなる
  const spawnInterval = Math.max(380, 1050 - elapsed * 9);

  if (now - lastSpawn >= spawnInterval) {
    spawnMissile(now);
    lastSpawn = now;
  }

  launchMissiles(now);
  if (!running) return;

  if (now - lastMove >= moveInterval) {
    advanceMissiles();
    lastMove = now;
    if (!running) return;
  }

  render();

  animationId = requestAnimationFrame(gameLoop);
}

// ゲームオーバー
function endGame() {
  if (!running) return;

  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (score > best) {
    best = score;
    localStorage.setItem("missileSurvivorBest", String(best));
    bestElement.textContent = best;
    messageElement.textContent = "NEW BEST! 生存時間を更新！";
  } else {
    messageElement.textContent = "GAME OVER！ スコア：" + score;
  }

  startButton.textContent = "TRY AGAIN";
  render();
}

// 方向入力
const directions = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    const [dx, dy] = directions[button.dataset.dir];
    movePlayer(dx, dy);
  });
});

document.addEventListener("keydown", event => {
  const keys = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",
    w: "up",
    s: "down",
    a: "left",
    d: "right"
  };

  const direction = keys[event.key];
  if (!direction) return;

  event.preventDefault();

  const [dx, dy] = directions[direction];
  movePlayer(dx, dy);
});

// スワイプ操作
let touchStartX = 0;
let touchStartY = 0;

board.addEventListener("pointerdown", event => {
  touchStartX = event.clientX;
  touchStartY = event.clientY;
});

board.addEventListener("pointerup", event => {
  if (!running) return;

  const dx = event.clientX - touchStartX;
  const dy = event.clientY - touchStartY;

  // 小さすぎる動きは無視
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    movePlayer(dx > 0 ? 1 : -1, 0);
  } else {
    movePlayer(0, dy > 0 ? 1 : -1);
  }
});

startButton.addEventListener("click", startGame);

render();
</script>
</body>
</html>
