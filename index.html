
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MISSILE SURVIVOR</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  color-scheme: dark;
  --background: #101522;
  --grid-line: #aebbd0;
  --grid-background: #385d96;
  --missile-color: #ed1472;
}

html {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  background: var(--background);
  color: #f4f7ff;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

.game {
  width: 100%;
  max-width: 430px;
  max-height: 100%;
  overflow: hidden;
  text-align: center;
  touch-action: none;
  overscroll-behavior: none;
}

h1 {
  font-size: 27px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #95a7c4;
  margin-bottom: 15px;
}

.stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 3px 12px;
}

.stat {
  min-width: 65px;
}

.stat-label {
  color: #95a7c4;
  font-size: 10px;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 23px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#stage {
  position: relative;
  width: min(100%, 360px);
  aspect-ratio: 1;
  flex-shrink: 0;
  margin: 0 auto;
  overflow: hidden;
  background: #26364f;
  border: 1px solid #354968;
  border-radius: 8px;
  touch-action: none;
  overscroll-behavior: none;
}

#grid {
  position: absolute;
  left: 12.5%;
  top: 12.5%;
  width: 75%;
  height: 75%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(0, 1fr));
  background: var(--grid-background);
  border: 2px solid var(--grid-line);
  z-index: 1;
  pointer-events: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border-right: 2px solid var(--grid-line);
  border-bottom: 2px solid var(--grid-line);
}

.cell:nth-child(6n) {
  border-right: 0;
}

.cell:nth-last-child(-n + 6) {
  border-bottom: 0;
}

#player {
  position: absolute;
  background: #05080e;
  border: 2px solid #101522;
  border-radius: 5px;
  z-index: 4;
  pointer-events: none;
  transition: left 45ms linear, top 45ms linear;
}

#player::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  border: 2px solid #d7e8ff;
}

.missile {
  position: absolute;
  width: 30px;
  height: 18px;
  background: var(--missile-color);
  border-radius: 0 50% 50% 0;
  z-index: 5;
  pointer-events: none;
  will-change: left, top;
}

/* 追加：特殊ミサイルの黄色い正方形 */
.special-square {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #ffd928;
  border: 1px solid #fff19a;
  z-index: 6;
  pointer-events: none;
  box-shadow: 0 0 7px rgba(255, 217, 40, 0.7);
}

/* 追加：感知時の白い点滅 */
.special-square.flash-white {
  background: #ffffff;
  border-color: #ffffff;
  box-shadow: 0 0 12px #ffffff;
}

/* 追加：特殊ミサイルのビーム */
.special-beam {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  background: #fff36a;
  box-shadow:
    0 0 5px #fff36a,
    0 0 12px #ffcf33;
}

#message {
  min-height: 38px;
  padding: 10px 0 6px;
  font-size: 13px;
  color: #bdcbe0;
}

#startButton {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #2879f5;
  color: white;
  font-size: 15px;
  font-weight: 800;
  touch-action: none;
}

.controls {
  display: none !important;
}

.controls button {
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: #29364b;
  color: white;
  font-size: 20px;
  touch-action: none;
}

.controls .empty {
  visibility: hidden;
}

@media (min-width: 600px) {
  .controls {
    display: none;
  }
}

@media (max-height: 650px) {
  body {
    padding: 6px;
  }

  h1 {
    font-size: 21px;
  }

  .subtitle {
    margin-bottom: 7px;
  }

  .stats {
    margin-bottom: 6px;
  }

  #stage {
    width: min(76vw, 360px, 43dvh);
  }

  #message {
    min-height: 28px;
    padding: 5px 0;
  }

  #startButton {
    padding: 9px;
  }

  .controls {
    margin-top: 5px;
  }
}
</style>
</head>

<body>
<main class="game">
  <h1>MISSILE SURVIVOR</h1>
  <div class="subtitle">DODGE THE MISSILES. SURVIVE.</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">0.0</div>
    </div>
    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="stage">
    <div id="grid"></div>
    <div id="player"></div>
  </div>

  <div id="message">スタートしてミサイルを避けよう！</div>
  <button id="startButton">GAME START</button>

  <div class="controls">
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="up">↑</button>
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="left">←</button>
    <button data-dir="down">↓</button>
    <button data-dir="right">→</button>
  </div>
</main>

<script>
"use strict";

const SIZE = 6;

const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const playerElement = document.getElementById("player");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const startButton = document.getElementById("startButton");

for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  grid.appendChild(cell);
}

let player = { x: 2, y: 2 };
let missiles = [];
let running = false;
let startTime = 0;
let previousTime = 0;
let lastSpawnTime = 0;
let lastSpecialSpawnTime = 0;
let score = 0;
let best = readBest();
let animationId = null;

/* 追加：特殊ミサイル専用の状態 */
let specialMissiles = [];
let audioContext = null;

bestElement.textContent = best;

function readBest() {
  try {
    return Number(localStorage.getItem("missileSurvivorBest")) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    localStorage.setItem("missileSurvivorBest", String(value));
  } catch {}
}

function getLayout() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;
  const gridLeft = width * 0.125;
  const gridTop = height * 0.125;
  const gridWidth = width * 0.75;
  const gridHeight = height * 0.75;

  return {
    width,
    height,
    gridLeft,
    gridTop,
    gridWidth,
    gridHeight,
    cellWidth: gridWidth / SIZE,
    cellHeight: gridHeight / SIZE
  };
}

function drawPlayer() {
  const g = getLayout();
  const w = g.cellWidth;
  const h = g.cellHeight;

  playerElement.style.left =
    (g.gridLeft + player.x * w + 5) + "px";
  playerElement.style.top =
    (g.gridTop + player.y * h + 5) + "px";
  playerElement.style.width = (w - 10) + "px";
  playerElement.style.height = (h - 10) + "px";
}

function drawMissile(m) {
  m.element.style.left = (m.x - m.w / 2) + "px";
  m.element.style.top = (m.y - m.h / 2) + "px";
}

function render() {
  drawPlayer();
  for (const m of missiles) drawMissile(m);
}

/* 既存：普通・速い・でかいミサイルの生成処理 */
function spawnMissile() {
  const g = getLayout();
  const side = Math.floor(Math.random() * 4);
  const lane = Math.floor(Math.random() * SIZE);

  const roll = Math.random();
  const type =
    roll < 3 / 4 ? "normal" :
    roll < 11 / 12 ? "fast" :
    "big";

  const m = {
    type,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: 0,
    w: 30,
    h: 18,
    speed: 190,
    element: document.createElement("div")
  };

  if (type === "fast") {
    m.w = 27;
    m.h = 9;
    m.speed = 330;
    m.element.style.background = "#22d3c5";
  } else if (type === "normal") {
    m.w = 30;
    m.h = 18;
    m.speed = 190;
    m.element.style.background = "#ed1472";
  } else if (type === "big") {
    m.w = 120;
    m.h = 72;
    m.speed = 77;
    m.element.style.background = "#05070c";
    m.element.style.border = "1px solid #718096";
  }

  m.element.className = "missile";
  m.element.style.width = m.w + "px";
  m.element.style.height = m.h + "px";

  if (side === 0) {
    m.x = -m.w / 2;
    m.y = type === "big"
      ? g.gridTop + lane * g.cellHeight
      : g.gridTop + (lane + 0.5) * g.cellHeight;
    m.vx = m.speed;
    m.angle = 0;
  } else if (side === 1) {
    m.x = g.width + m.w / 2;
    m.y = type === "big"
      ? g.gridTop + lane * g.cellHeight
      : g.gridTop + (lane + 0.5) * g.cellHeight;
    m.vx = -m.speed;
    m.angle = 180;
  } else if (side === 2) {
    m.x = type === "big"
      ? g.gridLeft + lane * g.cellWidth
      : g.gridLeft + (lane + 0.5) * g.cellWidth;
    m.y = -m.w / 2;
    m.vy = m.speed;
    m.angle = 90;
  } else {
    m.x = type === "big"
      ? g.gridLeft + lane * g.cellWidth
      : g.gridLeft + (lane + 0.5) * g.cellWidth;
    m.y = g.height + m.w / 2;
    m.vy = -m.speed;
    m.angle = -90;
  }

  m.element.style.transform = `rotate(${m.angle}deg)`;
  stage.appendChild(m.element);
  missiles.push(m);
  drawMissile(m);
}

/* =========================================================
   追加：特殊ミサイル
   ========================================================= */

/* 効果音。「ピッ」「ピッ」「ビー」に使う */
function playSpecialSound(frequency, duration, volume = 0.07) {
  try {
    if (!audioContext) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(frequency, now);

    gain.gain.setValueAtTime(volume, now);
    gain.gain.setValueAtTime(volume, now + duration * 0.75);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + duration);
  } catch {}
}

/*
特殊ミサイルの方向：
horizontal = 左右から来て、上下の外側を水平移動
vertical   = 上下から来て、左右の外側を垂直移動

プレイヤーのマスの中心に到達したら停止し、
白く2回点滅したあと、ビームを発射する。
*/
function spawnSpecialMissile() {
  const g = getLayout();

  const fromHorizontal = Math.random() < 0.5;
  const fromStart = Math.random() < 0.5;

  const special = {
    axis: fromHorizontal ? "horizontal" : "vertical",
    direction: fromStart ? 1 : -1,

    x: 0,
    y: 0,

    speed: 150,
    phase: "moving",
    phaseStart: performance.now(),

    targetLane: 0,
    beamOn: false,
    flashStep: -1,

    squares: [],
    beamElement: document.createElement("div")
  };

  special.beamElement.className = "special-beam";
  special.beamElement.style.display = "none";
  stage.appendChild(special.beamElement);

  for (let i = 0; i < 2; i++) {
    const square = document.createElement("div");
    square.className = "special-square";
    stage.appendChild(square);
    special.squares.push(square);
  }

  if (special.axis === "horizontal") {
    special.x = fromStart ? -8 : g.width + 8;
    special.y = 0;
  } else {
    special.y = fromStart ? -8 : g.height + 8;
    special.x = 0;
  }

  specialMissiles.push(special);
  drawSpecialMissile(special);
}

/* 黄色い2つの正方形とビームを描画 */
function drawSpecialMissile(special) {
  const g = getLayout();
  const squareSize = 16;

  if (special.axis === "horizontal") {
    const upperY = g.gridTop - squareSize;
    const lowerY = g.gridTop + g.gridHeight;

    special.squares[0].style.left =
      (special.x - squareSize / 2) + "px";
    special.squares[0].style.top = upperY + "px";

    special.squares[1].style.left =
      (special.x - squareSize / 2) + "px";
    special.squares[1].style.top = lowerY + "px";
  } else {
    const leftX = g.gridLeft - squareSize;
    const rightX = g.gridLeft + g.gridWidth;

    special.squares[0].style.left = leftX + "px";
    special.squares[0].style.top =
      (special.y - squareSize / 2) + "px";

    special.squares[1].style.left = rightX + "px";
    special.squares[1].style.top =
      (special.y - squareSize / 2) + "px";
  }

  const isWhite =
    special.phase === "flash" &&
    (special.flashStep === 0 || special.flashStep === 2);

  for (const square of special.squares) {
    square.classList.toggle("flash-white", isWhite);
  }

  drawSpecialBeam(special);
}

/* ビームはマスの中心を通す */
function drawSpecialBeam(special) {
  const g = getLayout();
  const beam = special.beamElement;

  if (special.phase !== "beam" || !special.beamOn) {
    beam.style.display = "none";
    return;
  }

  beam.style.display = "block";

  if (special.axis === "horizontal") {
    const centerX =
      g.gridLeft + (special.targetLane + 0.5) * g.cellWidth;

    beam.style.left = (centerX - 2.5) + "px";
    beam.style.top = (g.gridTop - 8) + "px";
    beam.style.width = "5px";
    beam.style.height = (g.gridHeight + 16) + "px";
  } else {
    const centerY =
      g.gridTop + (special.targetLane + 0.5) * g.cellHeight;

    beam.style.left = (g.gridLeft - 8) + "px";
    beam.style.top = (centerY - 2.5) + "px";
    beam.style.width = (g.gridWidth + 16) + "px";
    beam.style.height = "5px";
  }
}

/*
プレイヤーの現在位置を狙う。
感知したら正方形を停止させ、狙ったマスの位置を固定する。
*/
function detectPlayer(special) {
  const g = getLayout();

  if (special.axis === "horizontal") {
    const targetX =
      g.gridLeft + (player.x + 0.5) * g.cellWidth;

    const distance = targetX - special.x;

    if (
      (special.direction === 1 && distance >= 0 &&
        distance <= special.speed * 0.05 + 1) ||
      (special.direction === -1 && distance <= 0 &&
        distance >= -(special.speed * 0.05 + 1))
    ) {
      special.x = targetX;
      special.targetLane = player.x;
      beginSpecialFlash(special);
    }
  } else {
    const targetY =
      g.gridTop + (player.y + 0.5) * g.cellHeight;

    const distance = targetY - special.y;

    if (
      (special.direction === 1 && distance >= 0 &&
        distance <= special.speed * 0.05 + 1) ||
      (special.direction === -1 && distance <= 0 &&
        distance >= -(special.speed * 0.05 + 1))
    ) {
      special.y = targetY;
      special.targetLane = player.y;
      beginSpecialFlash(special);
    }
  }
}

/* 感知後：白く2回点滅 */
function beginSpecialFlash(special) {
  special.phase = "flash";
  special.phaseStart = performance.now();
  special.flashStep = 0;

  playSpecialSound(900, 0.09);
}

/*
更新処理：
白点滅を2回（4段階）→「ピッ、ピッ、ビー」→終了。
ビームは短く2回点滅してから長く照射する。
*/
function updateSpecialMissiles(now, dt) {
  const g = getLayout();
  const remaining = [];

  for (const special of specialMissiles) {
    if (special.phase === "moving") {
      if (special.axis === "horizontal") {
        special.x += special.direction * special.speed * dt;
      } else {
        special.y += special.direction * special.speed * dt;
      }

      detectPlayer(special);

      if (special.phase === "moving") {
        const outside = special.axis === "horizontal"
          ? (special.x < -30 || special.x > g.width + 30)
          : (special.y < -30 || special.y > g.height + 30);

        if (outside) {
          removeSpecialMissile(special);
          continue;
        }
      }
    }

    if (special.phase === "flash") {
      const elapsed = now - special.phaseStart;
      const step = Math.floor(elapsed / 150);

      if (step !== special.flashStep && step < 4) {
        special.flashStep = step;

        if (step === 0 || step === 2) {
          playSpecialSound(900, 0.08);
        }
      }

      if (elapsed >= 600) {
        special.phase = "beam";
        special.phaseStart = now;
        special.beamOn = true;
        special.flashStep = -1;

        // 最初の短い「ピッ」
        playSpecialSound(650, 0.12);
      }
    } else if (special.phase === "beam") {
      const elapsed = now - special.phaseStart;

      if (elapsed < 120) {
        special.beamOn = true;
      } else if (elapsed < 240) {
        special.beamOn = false;
      } else if (elapsed < 360) {
        if (special.beamOn === false) {
          playSpecialSound(650, 0.12);
        }
        special.beamOn = true;
      } else if (elapsed < 480) {
        special.beamOn = false;
      } else if (elapsed < 1050) {
        if (!special.beamOn) {
          playSpecialSound(420, 0.55, 0.09);
        }
        special.beamOn = true;
      } else {
        removeSpecialMissile(special);
        continue;
      }
    }

    drawSpecialMissile(special);
    remaining.push(special);
  }

  specialMissiles = remaining;
}

function removeSpecialMissile(special) {
  for (const square of special.squares) {
    square.remove();
  }
  special.beamElement.remove();
}

/* ビームが実際に照射中かを確認 */
function checkSpecialCollision() {
  return specialMissiles.some(special => {
    if (special.phase !== "beam" || !special.beamOn) {
      return false;
    }

    if (special.axis === "horizontal") {
      return player.x === special.targetLane;
    }

    return player.y === special.targetLane;
  });
}

/* 既存ミサイルの当たり判定は変更しない */
function checkCollision() {
  const g = getLayout();

  const left = g.gridLeft + player.x * g.cellWidth + 5;
  const right = left + g.cellWidth - 10;
  const top = g.gridTop + player.y * g.cellHeight + 5;
  const bottom = top + g.cellHeight - 10;

  return missiles.some(m => {
    const vertical = m.angle === 90 || m.angle === -90;
    const w = vertical ? m.h : m.w;
    const h = vertical ? m.w : m.h;

    return (
      m.x + w / 2 > left &&
      m.x - w / 2 < right &&
      m.y + h / 2 > top &&
      m.y - h / 2 < bottom
    );
  });
}

function movePlayer(dx, dy) {
  if (!running) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) return;

  player.x = nx;
  player.y = ny;
  drawPlayer();

  if (checkCollision() || checkSpecialCollision()) {
    endGame();
  }
}

function gameLoop(now) {
  if (!running) return;

  const elapsed = (now - startTime) / 1000;
  const dt = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;

  score = Math.floor(elapsed * 10);
  scoreElement.textContent = score;
  timeElement.textContent = elapsed.toFixed(1);

  const spawnInterval = Math.max(180, 600 - elapsed * 7);
  const speedFactor = Math.min(2.2, 1 + elapsed * 0.012);

  if (now - lastSpecialSpawnTime >= 5000) {
    spawnSpecialMissile();
    lastSpecialSpawnTime = now;
  }

  if (now - lastSpawnTime >= spawnInterval) {
    spawnMissile();

    if (Math.random() < 1 / 30) {
      spawnSpecialMissile();
    }

    lastSpawnTime = now;
  }

  const g = getLayout();
  const remaining = [];

  for (const m of missiles) {
    m.x += m.vx * speedFactor * dt;
    m.y += m.vy * speedFactor * dt;

    const vertical = m.angle === 90 || m.angle === -90;
    const halfW = (vertical ? m.h : m.w) / 2;
    const halfH = (vertical ? m.w : m.h) / 2;
    const outside =
      m.x + halfW < 0 ||
      m.x - halfW > g.width ||
      m.y + halfH < 0 ||
      m.y - halfH > g.height;

    if (outside) {
      m.element.remove();
    } else {
      remaining.push(m);
    }
  }

  missiles = remaining;

  updateSpecialMissiles(now, dt);

  if (checkCollision() || checkSpecialCollision()) {
    endGame();
    return;
  }

  render();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  for (const m of missiles) m.element.remove();
  for (const special of specialMissiles) {
    removeSpecialMissile(special);
  }

  missiles = [];
  specialMissiles = [];
  player = { x: 2, y: 2 };
  score = 0;
  running = true;

  startTime = performance.now();
  previousTime = startTime;
  lastSpawnTime = startTime;
  lastSpecialSpawnTime = startTime;

  scoreElement.textContent = "0";
  timeElement.textContent = "0.0";
  messageElement.textContent = "四方からのミサイルを避けろ！";
  startButton.textContent = "RESTART";

  render();
  animationId = requestAnimationFrame(gameLoop);
}

function endGame() {
  if (!running) return;

  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (score > best) {
    best = score;
    saveBest(best);
    bestElement.textContent = best;
    messageElement.textContent = "NEW BEST! スコア：" + score;
  } else {
    messageElement.textContent = "GAME OVER！ スコア：" + score;
  }

  startButton.textContent = "TRY AGAIN";
}

const directions = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

function handleDirection(direction) {
  const [dx, dy] = directions[direction];
  movePlayer(dx, dy);
}

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    handleDirection(button.dataset.dir);
  });
});

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const keyMap = {
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right"
  };

  const direction = keyMap[key];

  if (direction && running) {
    event.preventDefault();
    handleDirection(direction);
  }
});

let touchStartX = 0;
let touchStartY = 0;
let touchActive = false;

document.addEventListener("touchstart", event => {
  if (!running || event.changedTouches.length === 0) return;

  const touch = event.changedTouches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchActive = true;

  event.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", event => {
  event.preventDefault();
}, { passive: false });

document.addEventListener("touchend", event => {
  if (!running || !touchActive || event.changedTouches.length === 0) {
    touchActive = false;
    return;
  }

  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  touchActive = false;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    handleDirection(dx > 0 ? "right" : "left");
  } else {
    handleDirection(dy > 0 ? "down" : "up");
  }

  event.preventDefault();
}, { passive: false });

document.addEventListener("touchcancel", () => {
  touchActive = false;
}, { passive: false });

startButton.addEventListener("click", startGame);

window.addEventListener("resize", render);

render();
</script>
</body>
</html>
